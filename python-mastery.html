https://docs.python.org/3/reference/datamodel.html#object.__new__", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 61, "t": "Inheritance", "an": "A child inherits family traits but can have its own.", "ex": "`class Child(Parent)` inherits attributes and methods. `super()` calls the next class in the **MRO** (method resolution order), computed by C3 linearisation. With multiple inheritance, `super()` follows the MRO, not just the parent.", "code": "class Base:\n    def hello(self):\n        return \"Base\"\n\nclass Left(Base):\n    def hello(self):\n        return \"Left>\" + super().hello()\n\nclass Right(Base):\n    def hello(self):\n        return \"Right>\" + super().hello()\n\nclass Child(Left, Right):\n    def hello(self):\n        return \"Child>\" + super().hello()\n\nprint(Child().hello())\nprint([c.__name__ for c in Child.__mro__])", "lang": "python", "out": "Child>Left>Right>Base\n['Child', 'Left', 'Right', 'Base', 'object']", "ill": false, "static": false, "pkgs": false, "pit": "Deep inheritance trees. Prefer shallow hierarchies and composition.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/classes.html#inheritance", "w": "mro", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 62, "t": "Polymorphism", "an": "The same 'play' button works on a CD, a phone and a radio.", "ex": "Different classes respond to the same method name. Python uses **duck typing**: if it has the method, it works, with no shared base class required.", "code": "class Helm:\n    def deploy(self, app):\n        return f\"helm upgrade --install {app}\"\n\nclass Kubectl:\n    def deploy(self, app):\n        return f\"kubectl apply -f {app}.yaml\"\n\nfor tool in (Helm(), Kubectl()):\n    print(tool.deploy(\"web\"))", "lang": "python", "out": "helm upgrade --install web\nkubectl apply -f web.yaml", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": "Swap deployment tools without changing the code that calls `deploy`.", "q": null, "a": null, "doc": "https://docs.python.org/3/glossary.html#term-duck-typing", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 63, "t": "Composition", "an": "A car *has* an engine; it is not a kind of engine.", "ex": "Build objects from other objects (**has-a**) instead of inheriting (**is-a**). Composition is more flexible, easier to test with fakes, and avoids fragile inheritance chains.", "code": "class Logger:\n    def log(self, m):\n        print(\"LOG\", m)\n\nclass Notifier:\n    def send(self, m):\n        print(\"SEND\", m)\n\nclass Deployer:\n    def __init__(self, logger, notifier):\n        self.logger, self.notifier = logger, notifier       # has-a\n    def run(self, app):\n        self.logger.log(f\"deploying {app}\")\n        self.notifier.send(f\"{app} deployed\")\n\nDeployer(Logger(), Notifier()).run(\"web\")", "lang": "python", "out": "LOG deploying web\nSEND web deployed", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": "\"Favour composition over inheritance.\" Inject collaborators through `__init__`.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/classes.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 64, "t": "Encapsulation", "an": "A TV remote: you press buttons and never touch the circuit board.", "ex": "Python relies on convention: `_name` means internal, `__name` triggers **name mangling** to `_Class__name`. Nothing is truly private. Expose a small public API and validate changes through methods or properties.", "code": "class Account:\n    def __init__(self, balance):\n        self._balance = balance        # internal by convention\n        self.__pin = 1234              # name-mangled to _Account__pin\n\n    def deposit(self, amount):\n        if amount <= 0:\n            raise ValueError(\"amount must be positive\")\n        self._balance += amount\n\na = Account(10)\na.deposit(5)\nprint(a._balance, list(vars(a)))", "lang": "python", "out": "15 ['_balance', '_Account__pin']", "ill": false, "static": false, "pkgs": false, "pit": "Making every attribute public and letting any code modify state in invalid ways.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/classes.html#private-variables", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 65, "t": "Abstraction", "an": "Driving a car without knowing how the engine works.", "ex": "Hide complexity behind a simple interface so callers depend on **what** something does, not **how**. Combine it with ABCs or Protocols to define the contract.", "code": "class Storage:\n    def put(self, key, data):\n        raise NotImplementedError\n\nclass MemoryStorage(Storage):\n    def __init__(self):\n        self.d = {}\n    def put(self, key, data):\n        self.d[key] = data\n        return len(data)\n\ndef backup(storage: Storage, key, data):\n    return storage.put(key, data)\n\nprint(backup(MemoryStorage(), \"k\", b\"hello\"))", "lang": "python", "out": "5", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": "Your code calls `cluster.scale(5)`, not the cloud provider's raw REST endpoints. That is an infrastructure abstraction.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/abc.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 66, "t": "Magic Methods", "an": "Secret handshakes that Python performs for you: `+`, `len()`, `for`, `with`.", "ex": "**Special (dunder) methods** let your objects work with operators and built-ins: `__repr__`, `__str__`, `__eq__`, `__lt__`, `__add__`, `__len__`, `__getitem__`, `__iter__`, `__bool__`, `__contains__`, `__enter__`/`__exit__`, `__call__`.", "code": "class Vec:\n    def __init__(self, *xs):\n        self.xs = list(xs)\n    def __repr__(self):\n        return f\"Vec{tuple(self.xs)}\"\n    def __add__(self, o):\n        return Vec(*(a + b for a, b in zip(self.xs, o.xs)))\n    def __len__(self):\n        return len(self.xs)\n    def __getitem__(self, i):\n        return self.xs[i]\n    def __eq__(self, o):\n        return self.xs == o.xs\n    def __bool__(self):\n        return any(self.xs)\n\nv = Vec(1, 2) + Vec(3, 4)\nprint(v, len(v), v[0], v == Vec(4, 6), bool(Vec(0, 0)), list(v))", "lang": "python", "out": "Vec(4, 6) 2 4 True False [4, 6]", "ill": false, "static": false, "pkgs": false, "pit": "Defining `__eq__` without `__hash__` makes the class unhashable.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/reference/datamodel.html#special-method-names", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 67, "t": "Properties", "an": "A front-desk clerk who checks your request before touching the filing cabinet.", "ex": "`@property` exposes a method as an attribute: computed values and validated setters, with a clean public API. Start with a plain attribute; promote it to a property later without changing callers.", "code": "class Pool:\n    def __init__(self, size):\n        self.size = size\n    @property\n    def size(self):\n        return self._size\n    @size.setter\n    def size(self, v):\n        if v < 1:\n            raise ValueError(\"size must be >= 1\")\n        self._size = v\n    @property\n    def doubled(self):\n        return self._size * 2\n\np = Pool(2)\np.size = 5\nprint(p.size, p.doubled)\ntry:\n    p.size = 0\nexcept ValueError as e:\n    print(e)", "lang": "python", "out": "5 10\nsize must be >= 1", "ill": false, "static": false, "pkgs": false, "pit": "Writing Java-style `get_x()` / `set_x()` methods.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/functions.html#property", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 68, "t": "Descriptors", "an": "A security guard stationed at one attribute, deciding what happens on read and write.", "ex": "A **descriptor** is an object with `__get__`, `__set__` and/or `__delete__` placed on a class. Properties, methods, `classmethod` and `staticmethod` are built on descriptors. Reusable validation lives naturally here.", "code": "class Positive:\n    def __set_name__(self, owner, name):\n        self.name = \"_\" + name\n    def __get__(self, obj, owner=None):\n        return self if obj is None else getattr(obj, self.name)\n    def __set__(self, obj, value):\n        if value <= 0:\n            raise ValueError(\"must be positive\")\n        setattr(obj, self.name, value)\n\nclass Item:\n    qty = Positive()\n    price = Positive()\n    def __init__(self, qty, price):\n        self.qty, self.price = qty, price\n\ni = Item(2, 9.5)\nprint(i.qty, i.price)\ntry:\n    i.qty = -1\nexcept ValueError as e:\n    print(\"rejected:\", e)", "lang": "python", "out": "2 9.5\nrejected: must be positive", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/howto/descriptor.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 69, "t": "Metaclasses", "an": "A factory that builds the blueprints themselves.", "ex": "A **metaclass** is the class of a class (default: `type`). It runs when a class is *defined*. Real need is rare: `__init_subclass__` or a class decorator usually does the job more simply. Frameworks (ORMs, Enum, ABC) use metaclasses.", "code": "class Registry(type):\n    classes = []\n    def __new__(mcls, name, bases, ns):\n        cls = super().__new__(mcls, name, bases, ns)\n        if bases:\n            Registry.classes.append(name)\n        return cls\n\nclass Plugin(metaclass=Registry):\n    pass\nclass Aws(Plugin):\n    pass\nclass Gcp(Plugin):\n    pass\nprint(Registry.classes, type(Aws).__name__, type(Registry).__name__)\n\nclass Base:\n    registry = []\n    def __init_subclass__(cls, **kw):\n        super().__init_subclass__(**kw)\n        Base.registry.append(cls.__name__)\nclass One(Base):\n    pass\nclass Two(Base):\n    pass\nprint(Base.registry)", "lang": "python", "out": "['Aws', 'Gcp'] Registry type\n['One', 'Two']", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": "Reach for `__init_subclass__` before a metaclass.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/reference/datamodel.html#metaclasses", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 70, "t": "SOLID Principles", "an": "Five habits of tidy builders so that houses stay easy to extend.", "ex": "**S**ingle responsibility: one reason to change. **O**pen/closed: extend without modifying. **L**iskov substitution: subtypes must be usable wherever the base is. **I**nterface segregation: small focused interfaces. **D**ependency inversion: depend on abstractions, not concretions. The example shows O and D: add a notifier without touching `alert`.", "code": "from typing import Protocol\n\nclass Notifier(Protocol):\n    def send(self, msg: str) -> None: ...\n\nclass Email:\n    def send(self, msg):\n        print(\"email:\", msg)\n\nclass Slack:\n    def send(self, msg):\n        print(\"slack:\", msg)\n\ndef alert(notifier: Notifier, msg):        # depends on the abstraction\n    notifier.send(msg)\n\nfor n in (Email(), Slack()):\n    alert(n, \"disk 90%\")", "lang": "python", "out": "email: disk 90%\nslack: disk 90%", "ill": false, "static": false, "pkgs": false, "pit": "Over-engineering: creating interfaces and factories for code that has one implementation.", "pro": "Apply SOLID when change pressure appears, not before.", "ops": null, "q": "Which principle says 'depend on abstractions, not concretions'?", "a": "Dependency Inversion (the D in SOLID).", "doc": "https://peps.python.org/pep-0544/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}]}, {"id": 5, "short": "Files & Data", "title": "Files and Data", "icon": "📁", "goal": "Read and write files safely, handle paths portably, and move data between formats: CSV, JSON, XML, YAML, pickle, compression and Excel, including the security rules for each.", "devops": "Platform work is data wrangling: parse `kubectl -o json`, edit YAML manifests, read CSV exports from billing, write JSON reports, archive logs. **Never `pickle.load` or `yaml.load` untrusted data.**", "docs": [["File I/O tutorial", "https://docs.python.org/3/tutorial/inputoutput.html"], ["pathlib", "https://docs.python.org/3/library/pathlib.html"], ["json", "https://docs.python.org/3/library/json.html"]], "mm": null, "topics": [{"n": 71, "t": "Files", "an": "Opening a notebook, reading or writing, then closing it so nothing is lost.", "ex": "`open(path, mode, encoding=...)` returns a file object. Always use `with` so the file closes even on errors. Modes: `r`, `w` (truncate), `a` (append), `x` (create), plus `b` for bytes. Iterating over a file reads **lazily** line by line, which is memory-friendly for huge logs.", "code": "from pathlib import Path\np = Path(\"demo.txt\")\np.write_text(\"line1\\nline2\\nline3\\n\", encoding=\"utf-8\")\nwith open(p, encoding=\"utf-8\") as f:\n    for line in f:                      # lazy: constant memory\n        print(line.rstrip())\nwith open(p, \"a\", encoding=\"utf-8\") as f:\n    f.write(\"line4\\n\")\nprint(len(p.read_text().splitlines()))\np.unlink()", "lang": "python", "out": "line1\nline2\nline3\n4", "ill": false, "static": false, "pkgs": false, "pit": "Omitting `encoding=` (platform-dependent default) and `.read()`-ing a multi-GB file into memory.", "pro": "Always `with`, always `encoding='utf-8'`, stream large files.", "ops": "Log files: iterate line by line, never load them whole.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/functions.html#open", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 72, "t": "Pathlib", "an": "An address book for files that understands every OS's address format.", "ex": "`pathlib.Path` replaces string path juggling: `/` joins, `.name`, `.suffix`, `.stem`, `.parent`, `.exists()`, `.mkdir()`, `.glob()` / `.rglob()`, `.read_text()`. Use `PurePosixPath` to manipulate paths without touching the disk.", "code": "from pathlib import Path, PurePosixPath\nimport shutil\np = PurePosixPath(\"/etc/kubernetes/pki/ca.crt\")\nprint(p.name, p.suffix, p.stem, p.parent, p.parts[:3])\nprint(PurePosixPath(\"a\") / \"b\" / \"c.txt\")\nbase = Path(\"proj\")\n(base / \"src\").mkdir(parents=True, exist_ok=True)\n(base / \"src\" / \"a.py\").write_text(\"x = 1\")\nprint(sorted(str(q) for q in base.rglob(\"*.py\")))\nshutil.rmtree(base)", "lang": "python", "out": "ca.crt .crt ca /etc/kubernetes/pki ('/', 'etc', 'kubernetes')\na/b/c.txt\n['proj/src/a.py']", "ill": false, "static": false, "pkgs": false, "pit": "Concatenating paths with `+` or hard-coding `\\\\` or `/`.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/pathlib.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 73, "t": "CSV", "an": "A very plain spreadsheet saved as text.", "ex": "Use the `csv` module (not `str.split(',')`) because it handles quotes, commas inside fields and different dialects. `DictReader` / `DictWriter` map columns to dict keys. Remember: everything read is a string.", "code": "import csv, io\ndata = \"name,cpu\\nweb,2\\ndb,8\\n\"\nfor row in csv.DictReader(io.StringIO(data)):\n    print(row[\"name\"], int(row[\"cpu\"]) * 2)\nout = io.StringIO()\nw = csv.DictWriter(out, fieldnames=[\"name\", \"cpu\"], lineterminator=\"\\n\")\nw.writeheader()\nw.writerow({\"name\": \"x, y\", \"cpu\": 1})\nprint(out.getvalue(), end=\"\")", "lang": "python", "out": "web 4\ndb 16\nname,cpu\n\"x, y\",1", "ill": false, "static": false, "pkgs": false, "pit": "Splitting lines on commas manually and breaking on quoted fields.", "pro": null, "ops": "Cloud billing exports and inventory dumps are usually CSV.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/csv.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 74, "t": "JSON", "an": "A universal packing format that every language can unpack.", "ex": "`json.loads` / `json.dumps` convert between JSON text and Python dict/list/str/int/float/bool/None. Use `indent=2, sort_keys=True` for readable, stable output. Tuples become lists; non-JSON types need `default=`.", "code": "import json\nraw = '{\"items\": [{\"name\": \"d1\", \"users\": [\"vm-a\"]}, {\"name\": \"d2\"}]}'\nobj = json.loads(raw)\nunused = [d[\"name\"] for d in obj[\"items\"] if not d.get(\"users\")]\nprint(unused)\nprint(json.dumps(obj, indent=2, sort_keys=True)[:60])\nprint(json.dumps({\"n\": 1, \"t\": (1, 2), \"none\": None}))", "lang": "python", "out": "['d2']\n{\n  \"items\": [\n    {\n      \"name\": \"d1\",\n      \"users\": [\n  \n{\"n\": 1, \"t\": [1, 2], \"none\": null}", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": "`gcloud ... --format=json` or `kubectl ... -o json` → `json.loads` → filter: the unattached-disk cleanup in a few lines.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/json.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 75, "t": "XML", "an": "A tree of labelled boxes inside boxes.", "ex": "`xml.etree.ElementTree` parses and builds XML as an element tree. XML still appears in Maven/Java configs, SOAP and some cloud APIs.", "code": "import xml.etree.ElementTree as ET\nxml = \"<pods><pod name='web' cpu='2'/><pod name='db' cpu='8'/><\/pods>\"\nroot = ET.fromstring(xml)\nprint([(p.get(\"name\"), int(p.get(\"cpu\"))) for p in root.findall(\"pod\")])\nroot.append(ET.Element(\"pod\", name=\"cache\", cpu=\"1\"))\nprint(ET.tostring(root, encoding=\"unicode\"))", "lang": "python", "out": "[('web', 2), ('db', 8)]\n<pods><pod name=\"web\" cpu=\"2\" /><pod name=\"db\" cpu=\"8\" /><pod name=\"cache\" cpu=\"1\" /><\/pods>", "ill": false, "static": false, "pkgs": false, "pit": "Parsing untrusted XML with the standard library. Use `defusedxml` (protects against entity-expansion attacks).", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/xml.etree.elementtree.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 76, "t": "YAML", "an": "JSON for humans: indentation instead of braces.", "ex": "YAML is the language of Kubernetes, Helm, Ansible and CI configs. `PyYAML` (third-party) provides `safe_load`, `safe_load_all` (multi-document files with `---`) and `safe_dump`. **Always use the safe variants.** Comments are lost on round trips; use `ruamel.yaml` to preserve them.", "code": "import yaml\ndoc = \"\"\"\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: web}\nspec:\n  replicas: 3\n---\nkind: Service\n\"\"\"\ndocs = list(yaml.safe_load_all(doc))\nprint([d[\"kind\"] for d in docs], docs[0][\"spec\"][\"replicas\"])\ndocs[0][\"spec\"][\"replicas\"] = 5\nprint(yaml.safe_dump(docs[0], sort_keys=False))", "lang": "python", "out": "['Deployment', 'Service'] 3\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web\nspec:\n  replicas: 5", "ill": false, "static": false, "pkgs": true, "pit": "`yaml.load(text)` with an unsafe loader can construct arbitrary Python objects (code execution). Also: the unquoted word `no` or `NO` can parse as `False`.", "pro": null, "ops": "Read, patch and re-emit Kubernetes manifests programmatically.", "q": null, "a": null, "doc": "https://pyyaml.org/wiki/PyYAMLDocumentation", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 77, "t": "Pickle", "an": "Freezing an object in a jar so you can thaw it later, but never thaw jars from strangers.", "ex": "`pickle` serialises almost any Python object to bytes. It is Python-only and **unsafe for untrusted input**: unpickling can execute arbitrary code. Use it for trusted caches; prefer JSON or protobuf for exchange.", "code": "import pickle\nobj = {\"a\": [1, 2], \"t\": (3, 4)}\nblob = pickle.dumps(obj)\nprint(pickle.loads(blob) == obj, type(blob).__name__)", "lang": "python", "out": "True bytes", "ill": false, "static": false, "pkgs": false, "pit": "Loading a pickle that came over the network or from a user upload.", "pro": "Treat `pickle.load` like `eval`: only for data you created yourself.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/pickle.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 78, "t": "Serialisation", "an": "Packing a suitcase (serialise) and unpacking it at the destination (deserialise).", "ex": "Choose the format by audience: **JSON** (interoperable, text), **YAML** (human config), **pickle** (Python-only, trusted), **protobuf/Avro/Parquet** (typed, compact, analytics). Dataclass → dict → JSON is the common path; add `default=` for dates or custom types.", "code": "import json, datetime\nfrom dataclasses import dataclass, asdict\n\n@dataclass\nclass Cfg:\n    name: str\n    replicas: int\n\ntext = json.dumps(asdict(Cfg(\"web\", 3)))\nprint(text, Cfg(**json.loads(text)))\nprint(json.dumps({\"t\": datetime.date(2026, 10, 15)}, default=str))", "lang": "python", "out": "{\"name\": \"web\", \"replicas\": 3} Cfg(name='web', replicas=3)\n{\"t\": \"2026-10-15\"}", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/json.html#json.dumps", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 79, "t": "Compression", "an": "Vacuum-packing clothes to save space.", "ex": "`gzip`, `zlib`, `bz2`, `lzma` compress streams; `zipfile` and `tarfile` handle archives. Text with repeated patterns (logs) compresses very well.", "code": "import gzip, zlib, io, zipfile\ndata = b\"log line\\n\" * 1000\nprint(len(data), len(gzip.compress(data)) < 100, zlib.decompress(zlib.compress(data)) == data)\nbuf = io.BytesIO()\nwith zipfile.ZipFile(buf, \"w\", zipfile.ZIP_DEFLATED) as z:\n    z.writestr(\"a.txt\", \"hello\")\nprint(zipfile.ZipFile(io.BytesIO(buf.getvalue())).namelist())", "lang": "python", "out": "9000 True True\n['a.txt']", "ill": false, "static": false, "pkgs": false, "pit": "Extracting untrusted archives without checking member paths (zip-slip).", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/gzip.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 80, "t": "Excel Files", "an": "A spreadsheet with tabs, formulas and formatting.", "ex": "`openpyxl` reads and writes `.xlsx` (workbooks, sheets, cells, formulas, styles). `pandas.read_excel` is the quick path for tables. Treat spreadsheets as a delivery format for people, not a database.", "code": "from openpyxl import Workbook, load_workbook\nimport io\nwb = Workbook()\nws = wb.active\nws.title = \"fleet\"\nws.append([\"name\", \"cpu\"])\nws.append([\"web\", 2])\nws.append([\"db\", 8])\nws[\"C1\"] = \"total\"\nws[\"C2\"] = \"=SUM(B2:B3)\"\nbuf = io.BytesIO()\nwb.save(buf)\nws2 = load_workbook(io.BytesIO(buf.getvalue())).active\nprint(ws2.title, [[c.value for c in row] for row in ws2.iter_rows()])", "lang": "python", "out": "fleet [['name', 'cpu', 'total'], ['web', 2, '=SUM(B2:B3)'], ['db', 8, None]]", "ill": false, "static": true, "pkgs": false, "pit": null, "pro": null, "ops": "Generate cost or inventory reports for managers straight from API data.", "q": null, "a": null, "doc": "https://openpyxl.readthedocs.io/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}]}, {"id": 6, "short": "Testing", "title": "Testing and Quality", "icon": "🧪", "goal": "Make code you can trust and change: unit tests, pytest, mocking, test-driven development, linting, formatting, static analysis, coverage and running all of it in CI.", "devops": "Infrastructure scripts that touch production **deserve tests more than app code does**. Mock the cloud API, test the decision logic, lint and type-check in CI, and block merges when checks fail.", "docs": [["unittest", "https://docs.python.org/3/library/unittest.html"], ["pytest", "https://docs.pytest.org/"], ["Ruff", "https://docs.astral.sh/ruff/"], ["mypy", "https://mypy.readthedocs.io/"]], "mm": "flowchart LR\nA[\"git push\"] --> B[\"Lint: ruff\"] --> C[\"Types: mypy\"] --> D[\"Tests: pytest with coverage\"] --> E{\"All green?\"}\nE -->|yes| F[\"Merge and deploy\"]\nE -->|no| G[\"Fix and push again\"]", "topics": [{"n": 81, "t": "Unit Testing", "an": "Checking each brick before you build the wall.", "ex": "A **unit test** checks one small piece of behaviour in isolation and runs in milliseconds. The standard library's `unittest` provides `TestCase`, assertions and a runner. Tests should be **fast, independent, deterministic and readable**: *arrange, act, assert*.", "code": "import unittest, io\n\ndef total(xs):\n    return sum(xs)\n\nclass T(unittest.TestCase):\n    def test_sum(self):\n        self.assertEqual(total([1, 2]), 3)\n    def test_raises(self):\n        with self.assertRaises(TypeError):\n            total(None)\n\nsuite = unittest.defaultTestLoader.loadTestsFromTestCase(T)\nres = unittest.TextTestRunner(stream=io.StringIO()).run(suite)\nprint(res.testsRun, res.wasSuccessful(), len(res.failures))", "lang": "python", "out": "2 True 0", "ill": false, "static": false, "pkgs": false, "pit": "Tests that depend on each other, the clock, the network or run order.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/unittest.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 82, "t": "Pytest", "an": "A friendlier examiner: plain `assert`, clear failure messages, reusable setup.", "ex": "`pytest` discovers `test_*.py` files and `test_*` functions, uses plain `assert` with rich failure output, **fixtures** for setup/teardown, and `@pytest.mark.parametrize` to run one test with many inputs. Run: `pytest -q`.", "code": "import pytest\n\ndef add(a, b):\n    return a + b\n\n@pytest.fixture\ndef numbers():\n    return (2, 3)\n\ndef test_add(numbers):\n    assert add(*numbers) == 5\n\n@pytest.mark.parametrize(\"a,b,expected\", [(1, 1, 2), (0, 0, 0), (-1, 1, 0)])\ndef test_add_param(a, b, expected):\n    assert add(a, b) == expected\n\ndef test_raises():\n    with pytest.raises(TypeError):\n        add(1, None)", "lang": "python", "out": ".....                                                                    [100%]\n5 passed in 0.01s", "ill": false, "static": true, "pkgs": false, "pit": null, "pro": "One behaviour per test, descriptive names, parametrize instead of loops.", "ops": null, "q": null, "a": null, "doc": "https://docs.pytest.org/en/stable/", "w": null, "mm": null, "skiprec": false, "pytest": true, "stdin": null}, {"n": 83, "t": "Mocking", "an": "A stunt double standing in for a dangerous scene.", "ex": "`unittest.mock` replaces slow, flaky or dangerous collaborators (HTTP, clock, cloud SDKs) with `Mock` objects that record how they were called. `patch` swaps names temporarily. Mock at the **boundaries** of your system.", "code": "from unittest.mock import Mock, patch\nimport os\n\ndef get_status(client):\n    return client.get(\"/health\").status_code\n\nclient = Mock()\nclient.get.return_value.status_code = 503\nprint(get_status(client), client.get.call_args)\n\nwith patch.dict(os.environ, {\"ENV\": \"test\"}):\n    print(os.environ[\"ENV\"])\n\nwith patch(\"time.sleep\") as fake:\n    import time\n    time.sleep(100)\n    print(\"no real sleep:\", fake.call_count)", "lang": "python", "out": "503 call('/health')\ntest\nno real sleep: 1", "ill": false, "static": false, "pkgs": false, "pit": "Mocking internals so deeply that tests break on every refactor.", "pro": null, "ops": "Mock the cloud SDK so a test of your 'delete unused disks' logic never deletes a real disk.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/unittest.mock.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 84, "t": "Test-Driven Development", "an": "Writing the exam before the lesson, then studying until you pass it.", "ex": "**Red → Green → Refactor.** Write a failing test, write the simplest code that passes, then clean up while tests keep you safe. TDD drives small designs and gives you a regression net by default.", "code": "# RED: write the test first (it fails because slugify does not exist yet)\ndef test_slug():\n    assert slugify(\"Hello, World!\") == \"hello-world\"\n\n# GREEN: the simplest implementation that passes\nimport re\ndef slugify(s):\n    return re.sub(r\"[^a-z0-9]+\", \"-\", s.lower()).strip(\"-\")\n\n# REFACTOR with the test as a safety net\ntest_slug()\nprint(\"green:\", slugify(\"  Platform   Eng  \"))", "lang": "python", "out": "green: platform-eng", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.pytest.org/en/stable/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 85, "t": "Linting", "an": "A proof-reader that spots mistakes before the book is printed.", "ex": "A **linter** finds likely bugs and style problems statically. **Ruff** (very fast, replaces flake8/isort/pyupgrade and more) is the modern default; `pylint` is deeper and slower. Configure in `pyproject.toml` and run in CI and pre-commit.", "code": "pip install ruff\nruff check --output-format concise .   # find bugs and style issues\nruff check --fix .                     # auto-fix what is safe", "lang": "bash", "out": "app.py:1:8: F401 [*] `os` imported but unused\napp.py:4:5: E711 Comparison to `None` should be `cond is None`\nFound 2 errors.\n[*] 1 fixable with the `--fix` option.", "ill": true, "static": false, "pkgs": false, "pit": null, "pro": "Enable rule groups gradually; fail CI on new violations.", "ops": null, "q": null, "a": null, "doc": "https://docs.astral.sh/ruff/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 86, "t": "Formatting", "an": "An automatic typesetter so nobody argues about spacing.", "ex": "A **formatter** rewrites code into one consistent style. `black` and `ruff format` are the standard; PEP 8 describes the conventions. Run on save and check in CI: `ruff format --check .`.", "code": "ruff format .            # or: black .\nruff format --check .    # CI: fail if anything would change", "lang": "bash", "out": "2 files reformatted, 5 files left unchanged", "ill": true, "static": false, "pkgs": false, "pit": null, "pro": "Never discuss formatting in code review: let the tool decide.", "ops": null, "q": null, "a": null, "doc": "https://black.readthedocs.io/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 87, "t": "Static Analysis", "an": "An inspector who checks the blueprints without building the house.", "ex": "Static analysers read code without running it. **Type checkers** (`mypy`, `pyright`) verify type hints; security linters (`bandit`) look for dangerous patterns; `ruff`/`pylint` catch logic smells. Start with `mypy --strict` on new modules.", "code": "# total.py\ndef total(xs: list[int]) -> int:\n    return sum(xs)\n\ntotal([\"a\"])         # wrong type\n\n# $ mypy total.py", "lang": "bash", "out": "total.py:5: error: List item 0 has incompatible type \"str\"; expected \"int\"  [list-item]\nFound 1 error in 1 file (checked 1 source file)", "ill": true, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": null, "a": null, "doc": "https://mypy.readthedocs.io/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 88, "t": "Coverage", "an": "A highlighter showing which lines your tests actually visited.", "ex": "`coverage.py` (or `pytest --cov`) reports which lines and branches ran during tests. Coverage shows what is **untested**, not that tests are good; use it to find gaps and set a floor (`--cov-fail-under`).", "code": "pip install pytest-cov\npytest --cov=src --cov-report=term-missing --cov-fail-under=80", "lang": "bash", "out": "Name              Stmts   Miss  Cover   Missing\n-----------------------------------------------\nsrc/core.py          20      3    85%   14-16\n-----------------------------------------------\nTOTAL                20      3    85%\nRequired test coverage of 80% reached. Total coverage: 85.00%", "ill": true, "static": false, "pkgs": false, "pit": "Chasing 100% coverage with assertion-free tests.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://coverage.readthedocs.io/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 89, "t": "CI/CD Testing Integration", "an": "A robot gatekeeper that runs every check on every change.", "ex": "CI runs lint, type-check and tests on every push and pull request, then CD deploys only if they pass. Cache dependencies, test on the Python versions you support, and fail the build on any red check.", "code": "name: ci\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.12\"\n      - run: pip install -e \".[dev]\"\n      - run: ruff check . && ruff format --check .\n      - run: mypy src\n      - run: pytest --cov=src --cov-fail-under=80", "lang": "yaml", "out": null, "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": "The same pipeline shape works in GitHub Actions, Azure DevOps, GitLab CI or Jenkins, and the Argo CD GitOps flow starts after it succeeds.", "q": null, "a": null, "doc": "https://docs.github.com/en/actions", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}]}, {"id": 7, "short": "Advanced", "title": "Advanced Python", "icon": "🚀", "goal": "Do many things at once and do them fast: concurrency models (threads, processes, asyncio), the GIL, race conditions, locks, then profiling, optimisation and memory analysis.", "devops": "Checking 200 clusters, calling cloud APIs, scraping metrics and streaming logs are all **I/O-bound**, where asyncio/threads shine. Data crunching is **CPU-bound**, where processes help. Profile before you optimise, and watch memory in long-running agents and exporters.", "docs": [["concurrent.futures", "https://docs.python.org/3/library/concurrent.futures.html"], ["asyncio", "https://docs.python.org/3/library/asyncio.html"], ["threading", "https://docs.python.org/3/library/threading.html"], ["Profilers", "https://docs.python.org/3/library/profile.html"]], "mm": "flowchart TD\nA[\"Slow program\"] --> B{\"What is it waiting for?\"}\nB -->|network or disk| C{\"How many tasks?\"}\nC -->|dozens| D[\"threading or ThreadPoolExecutor\"]\nC -->|thousands| E[\"asyncio\"]\nB -->|CPU computation| F[\"multiprocessing or ProcessPoolExecutor\"]", "topics": [{"n": 90, "t": "Concurrency", "an": "A kitchen: one cook doing everything in turn, many cooks sharing a stove (threads), or many kitchens (processes).", "ex": "**Concurrency** is making progress on several tasks at once. In CPython the **GIL** (global interpreter lock) lets only one thread execute Python bytecode at a time. So: **I/O-bound** work (waiting) speeds up with threads or asyncio; **CPU-bound** work needs multiple processes (or native code that releases the GIL). Recent CPython versions also ship an experimental free-threaded build; check the current docs before relying on it. Play with the model.", "code": null, "lang": "python", "out": null, "ill": false, "static": false, "pkgs": false, "pit": "Using threads to speed up CPU-bound Python loops, which gives no gain because of the GIL.", "pro": "Measure first. Pick threads for blocking libraries, asyncio for many connections, processes for CPU.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/concurrency.html", "w": "conc", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 91, "t": "Threading", "an": "Several waiters sharing one kitchen, serving tables while others wait for food.", "ex": "`threading.Thread` runs a function in another thread. The GIL is released during blocking I/O, so threads overlap waiting. Use `ThreadPoolExecutor` for a simpler API. Threads share memory, which is why they need locks.", "code": "import threading, time\nresults = []\n\ndef fetch(i):\n    time.sleep(0.2)            # pretend network I/O (releases the GIL)\n    results.append(i)\n\nt0 = time.perf_counter()\nthreads = [threading.Thread(target=fetch, args=(i,)) for i in range(5)]\nfor t in threads:\n    t.start()\nfor t in threads:\n    t.join()\nprint(sorted(results), \"took < 0.6s:\", time.perf_counter() - t0 < 0.6)", "lang": "python", "out": "[0, 1, 2, 3, 4] took < 0.6s: True", "ill": false, "static": true, "pkgs": false, "pit": null, "pro": null, "ops": "Polling many cloud APIs with a thread pool when the SDK is blocking.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/threading.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 92, "t": "Multiprocessing", "an": "Separate kitchens, each with its own stove, so nobody waits for the single GIL.", "ex": "`multiprocessing` and `ProcessPoolExecutor` run work in separate processes, each with its own interpreter and GIL, giving real CPU parallelism. Data crosses processes by **pickling**, so arguments must be picklable and start-up has a cost. Always guard with `if __name__ == \"__main__\":`.", "code": "from concurrent.futures import ProcessPoolExecutor\n\ndef cpu(n):\n    return sum(i * i for i in range(n))\n\nif __name__ == \"__main__\":\n    with ProcessPoolExecutor(max_workers=2) as ex:\n        print(list(ex.map(cpu, [10_000, 20_000, 30_000])))", "lang": "python", "out": "[333283335000, 2666466670000, 8999550005000]", "ill": false, "static": true, "pkgs": false, "pit": "Forgetting the `__main__` guard on platforms that spawn processes, which can cause a fork bomb.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/multiprocessing.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 93, "t": "AsyncIO", "an": "One very organised waiter who takes an order, goes to another table while the kitchen cooks, and returns when the food is ready.", "ex": "`asyncio` runs many tasks on **one thread** using cooperative multitasking. `async def` defines a coroutine, `await` hands control back to the event loop while waiting, and `asyncio.gather` runs coroutines concurrently. Everything on the path must be non-blocking (use async libraries such as `httpx`, `asyncpg`, `aiohttp`).", "code": "import asyncio\n\nasync def fetch(name, delay):\n    await asyncio.sleep(delay)\n    print(\"done\", name)\n    return name.upper()\n\nasync def main():\n    results = await asyncio.gather(fetch(\"a\", 0.3), fetch(\"b\", 0.1), fetch(\"c\", 0.2))\n    print(results)\n\nasyncio.run(main())", "lang": "python", "out": "done b\ndone c\ndone a\n['A', 'B', 'C']", "ill": false, "static": false, "pkgs": false, "pit": "Calling a blocking function (`time.sleep`, `requests.get`) inside a coroutine, which freezes the whole loop.", "pro": null, "ops": "AsyncIO → high-performance API services (FastAPI) and agents that poll hundreds of endpoints concurrently.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/asyncio.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 94, "t": "Event Loops", "an": "A dispatcher who keeps a to-do list and always handles whichever task is ready next.", "ex": "The **event loop** runs coroutines until they `await`, then switches to another ready task. `asyncio.run()` creates and closes the loop. `create_task()` schedules a coroutine to start soon. Tasks only switch at `await` points.", "code": "import asyncio\n\nasync def worker(n):\n    print(\"start\", n)\n    await asyncio.sleep(0)       # yield to the loop\n    print(\"end\", n)\n\nasync def main():\n    t1 = asyncio.create_task(worker(1))\n    t2 = asyncio.create_task(worker(2))\n    print(\"tasks scheduled\")\n    await asyncio.gather(t1, t2)\n\nasyncio.run(main())", "lang": "python", "out": "tasks scheduled\nstart 1\nstart 2\nend 1\nend 2", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/asyncio-eventloop.html", "w": null, "mm": "flowchart LR\nA[\"Ready queue\"] --> B[\"Run task until it awaits\"]\nB --> C{\"Waiting for I/O or timer?\"}\nC -->|yes| D[\"Park the task\"]\nD --> E[\"OS / selector signals I/O ready\"]\nE --> A\nC -->|no finished| F[\"Result available\"]", "skiprec": false, "pytest": false, "stdin": null}, {"n": 95, "t": "Coroutines", "an": "A recipe that can be paused halfway and resumed later.", "ex": "Calling an `async def` function does **not** run it: it returns a coroutine object. Something must `await` it, or hand it to the loop (`asyncio.run`, `create_task`). Forgetting `await` is the classic async bug (\"coroutine was never awaited\").", "code": "import asyncio, inspect\n\nasync def add(a, b):\n    return a + b\n\nco = add(1, 2)\nprint(inspect.iscoroutine(co), type(co).__name__)\nco.close()                       # avoid the 'never awaited' warning\nresult = asyncio.run(add(1, 2))\nprint(result)", "lang": "python", "out": "True coroutine\n3", "ill": false, "static": false, "pkgs": false, "pit": "Writing `add(1, 2)` without `await` and wondering why nothing happens.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/asyncio-task.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 96, "t": "Race Conditions", "an": "Two people editing the same spreadsheet cell at once: whoever saves last wins and the other change vanishes.", "ex": "A **race condition** happens when the result depends on the timing of threads touching shared mutable state. `counter += 1` is really *read, add, write*, so two threads can both read the same old value. Step through the interleavings, then fix it with a lock.", "code": "import threading\ncounter = 0\nlock = threading.Lock()\n\ndef work(n):\n    global counter\n    for _ in range(n):\n        with lock:                 # remove the lock and updates can be lost\n            counter += 1\n\nts = [threading.Thread(target=work, args=(10_000,)) for _ in range(4)]\nfor t in ts:\n    t.start()\nfor t in ts:\n    t.join()\nprint(counter)", "lang": "python", "out": "40000", "ill": false, "static": true, "pkgs": false, "pit": null, "pro": "Prefer sharing nothing: pass messages through a `queue.Queue`, or use immutable data.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/threading.html#lock-objects", "w": "race", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 97, "t": "Locks and Synchronisation", "an": "A single-key bathroom, a ticket counter and a starting pistol.", "ex": "`Lock` (one at a time), `RLock` (re-entrant), `Semaphore` (N at a time), `Event` (signal), `Condition`, and `queue.Queue` (thread-safe producer/consumer). **Deadlock** happens when threads wait for each other's locks; acquire locks in a consistent order and use timeouts.", "code": "import threading, queue\nq = queue.Queue()\n\ndef producer():\n    for i in range(3):\n        q.put(i)\n    q.put(None)\n\ndef consumer(out):\n    while (item := q.get()) is not None:\n        out.append(item * 10)\n\nout = []\ntp = threading.Thread(target=producer)\ntc = threading.Thread(target=consumer, args=(out,))\ntp.start(); tc.start(); tp.join(); tc.join()\nprint(out)\nsem = threading.Semaphore(2)\nprint(sem.acquire(), sem.acquire(), sem.acquire(blocking=False))", "lang": "python", "out": "[0, 10, 20]\nTrue True False", "ill": false, "static": true, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/queue.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 98, "t": "Performance Profiling", "an": "A stopwatch for every function so you stop guessing where the time goes.", "ex": "Measure before optimising. `cProfile` shows time per function (`python -m cProfile -s cumtime app.py`); `pstats` sorts and filters; `timeit` benchmarks small snippets; sampling profilers such as `py-spy` attach to a running process without code changes.", "code": "import cProfile, pstats, io\n\ndef slow():\n    return sum(i * i for i in range(200_000))\n\ndef main():\n    return [slow() for _ in range(3)]\n\npr = cProfile.Profile()\npr.enable()\nmain()\npr.disable()\ns = io.StringIO()\npstats.Stats(pr, stream=s).sort_stats(\"cumulative\").print_stats(5)\nprint(any(\"slow\" in line for line in s.getvalue().splitlines()))", "lang": "python", "out": "True", "ill": false, "static": true, "pkgs": false, "pit": "Optimising code that was never the bottleneck.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/profile.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 99, "t": "Optimisation", "an": "Fixing the traffic jam, not polishing the car.", "ex": "Order of impact: **better algorithm or data structure** > fewer I/O calls and caching > built-ins and comprehensions > micro-tweaks. Use `set`/`dict` for lookups, `str.join`, `functools.cache`, generators for large data, NumPy for numeric arrays, and `__slots__`/`dataclass(slots=True)` for millions of small objects.", "code": "import timeit\nsetup = \"xs = list(range(10_000)); s = set(xs)\"\nt_list = timeit.timeit(\"9_999 in xs\", setup, number=200)\nt_set = timeit.timeit(\"9_999 in s\", setup, number=200)\nprint(\"set faster than list:\", t_set < t_list)\nparts = [str(i) for i in range(5)]\nprint(\"\".join(parts))", "lang": "python", "out": "set faster than list: True\n01234", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": "Profile, change one thing, re-measure, and keep a benchmark in the repo.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/timeit.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 100, "t": "Memory Profiling", "an": "Weighing the luggage to see what is making it heavy.", "ex": "`tracemalloc` (standard library) records where memory is allocated; `sys.getsizeof` gives shallow sizes; tools like `memray` and `memory_profiler` show peaks over time. Generators and chunked reads keep memory flat.", "code": "import tracemalloc\ntracemalloc.start()\ndata = [str(i) * 10 for i in range(50_000)]\ncur, peak = tracemalloc.get_traced_memory()\nprint(\"allocated > 1 MB:\", cur > 1_000_000)\ntotal = sum(len(str(i) * 10) for i in range(50_000))     # no big list\ncur2, peak2 = tracemalloc.get_traced_memory()\nprint(\"generator added < 100 KB:\", cur2 - cur < 100_000)\ntracemalloc.stop()", "lang": "python", "out": "allocated > 1 MB: True\ngenerator added < 100 KB: True", "ill": false, "static": true, "pkgs": false, "pit": null, "pro": null, "ops": "Long-running exporters and agents leak memory slowly. Take `tracemalloc` snapshots and compare them.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/tracemalloc.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}]}, {"id": 8, "short": "Databases", "title": "Databases", "icon": "🗄️", "goal": "Store and query data reliably: SQL fundamentals, SQLite, PostgreSQL, SQLAlchemy, transactions, indexes, connection pooling and schema migrations.", "devops": "Platform engineers run PostgreSQL (Cloud SQL, RDS), monitor it (`pg_stat_activity`, locks, connection counts) and automate schema changes. **Pool size × app replicas must stay below `max_connections`**, and migrations belong in your delivery pipeline.", "docs": [["sqlite3", "https://docs.python.org/3/library/sqlite3.html"], ["PostgreSQL docs", "https://www.postgresql.org/docs/current/"], ["SQLAlchemy", "https://docs.sqlalchemy.org/"]], "mm": "flowchart LR\nAPP[\"Python app\"] --> POOL[\"Connection pool\"]\nPOOL --> PG[(\"PostgreSQL\")]\nMIG[\"Alembic migrations\"] --> PG\nMON[\"Monitoring: pg_stat_activity\"] --> PG", "topics": [{"n": 101, "t": "SQL Fundamentals", "an": "Asking a very organised librarian precise questions about a catalogue.", "ex": "SQL describes **what** data you want. Core clauses: `SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY … LIMIT`, plus `JOIN`, `INSERT`, `UPDATE`, `DELETE`, `CREATE TABLE`. Logical evaluation order: `FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT`. Edit the query below and run it.", "code": "import sqlite3\ndb = sqlite3.connect(\":memory:\")\ndb.executescript(\"\"\"\nCREATE TABLE pods(name TEXT, ns TEXT, cpu INTEGER);\nINSERT INTO pods VALUES ('web','prod',2),('api','prod',4),('db','data',8),('job','data',1);\n\"\"\")\nq = \"\"\"SELECT ns, COUNT(*) AS n, SUM(cpu) AS cpu\n       FROM pods GROUP BY ns HAVING SUM(cpu) > 3 ORDER BY cpu DESC\"\"\"\nfor row in db.execute(q):\n    print(row)", "lang": "python", "out": "('data', 2, 9)\n('prod', 2, 6)", "ill": false, "static": false, "pkgs": false, "pit": "`SELECT *` in production code and filtering in Python what the database could filter.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://www.postgresql.org/docs/current/sql.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 102, "t": "SQLite", "an": "A whole database in a single file, like a pocket notebook.", "ex": "`sqlite3` ships with Python: zero setup, great for scripts, caches, tests and local state. **Always use parameter placeholders** (`?`) instead of string formatting, which prevents SQL injection. Use `row_factory = sqlite3.Row` for dict-like rows.", "code": "import sqlite3\ndb = sqlite3.connect(\":memory:\")\ndb.row_factory = sqlite3.Row\ndb.execute(\"CREATE TABLE u(id INTEGER PRIMARY KEY, name TEXT UNIQUE)\")\nwith db:\n    db.executemany(\"INSERT INTO u(name) VALUES (?)\", [(\"ann\",), (\"bob\",)])\nevil = \"x'; DROP TABLE u; --\"\nprint(db.execute(\"SELECT * FROM u WHERE name = ?\", (evil,)).fetchall())\nprint([dict(r) for r in db.execute(\"SELECT * FROM u\")])", "lang": "python", "out": "[]\n[{'id': 1, 'name': 'ann'}, {'id': 2, 'name': 'bob'}]", "ill": false, "static": false, "pkgs": false, "pit": "Building SQL with f-strings: `f\"... WHERE name = '{name}'\"` is SQL injection.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/sqlite3.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 103, "t": "PostgreSQL", "an": "The industrial-strength warehouse behind most production systems.", "ex": "PostgreSQL is a server database reached over the network. Python drivers: `psycopg` (v3) and `asyncpg`. Authenticate with environment variables or a secret manager, and give monitoring tools a **read-only role**. `pg_stat_activity` shows sessions, state and waits; `pg_locks` shows blocking.", "code": "import os\nimport psycopg                         # pip install \"psycopg[binary]\"\n\ndsn = os.environ[\"DATABASE_URL\"]       # never hard-code passwords\nwith psycopg.connect(dsn) as conn:\n    with conn.cursor() as cur:\n        cur.execute(\n            \"SELECT pid, state, wait_event FROM pg_stat_activity WHERE datname = %s\",\n            (\"app\",),\n        )\n        for row in cur.fetchall():\n            print(row)", "lang": "python", "out": null, "ill": false, "static": true, "pkgs": false, "pit": null, "pro": null, "ops": "This is the core of a Cloud SQL health or blocking-session checker, using a dedicated read-only monitoring user.", "q": null, "a": null, "doc": "https://www.psycopg.org/psycopg3/docs/", "w": null, "mm": null, "skiprec": true, "pytest": false, "stdin": null}, {"n": 104, "t": "SQLAlchemy", "an": "A translator that lets you speak Python while the database hears SQL.", "ex": "SQLAlchemy has two layers: **Core** (SQL expression language, engine, connections) and the **ORM** (map classes to tables, work with objects and a `Session`). It supports many databases with one API and powers Alembic migrations.", "code": "from sqlalchemy import create_engine, String, select\nfrom sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, Session\n\nclass Base(DeclarativeBase):\n    pass\n\nclass Server(Base):\n    __tablename__ = \"servers\"\n    id: Mapped[int] = mapped_column(primary_key=True)\n    name: Mapped[str] = mapped_column(String(30))\n\nengine = create_engine(\"sqlite:///:memory:\")\nBase.metadata.create_all(engine)\nwith Session(engine) as s:\n    s.add_all([Server(name=\"web\"), Server(name=\"db\")])\n    s.commit()\n    print([x.name for x in s.scalars(select(Server).order_by(Server.name))])", "lang": "python", "out": "['db', 'web']", "ill": false, "static": true, "pkgs": true, "pit": "The N+1 query problem: lazy-loading related rows in a loop. Use `selectinload` / `joinedload`.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.sqlalchemy.org/en/20/tutorial/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 105, "t": "Transactions", "an": "Moving money between accounts: either both steps happen or neither does.", "ex": "A **transaction** groups statements so they succeed or fail together (**ACID**: atomicity, consistency, isolation, durability). In `sqlite3`, `with db:` commits on success and rolls back on exception. Keep transactions short and avoid user interaction inside them.", "code": "import sqlite3\ndb = sqlite3.connect(\":memory:\")\ndb.execute(\"CREATE TABLE acct(id INTEGER PRIMARY KEY, bal INTEGER CHECK (bal >= 0))\")\ndb.executemany(\"INSERT INTO acct VALUES (?, ?)\", [(1, 100), (2, 50)])\ndb.commit()\n\ndef transfer(src, dst, amt):\n    try:\n        with db:                  # BEGIN ... COMMIT, or ROLLBACK on error\n            db.execute(\"UPDATE acct SET bal = bal - ? WHERE id = ?\", (amt, src))\n            db.execute(\"UPDATE acct SET bal = bal + ? WHERE id = ?\", (amt, dst))\n        return \"committed\"\n    except sqlite3.IntegrityError:\n        return \"rolled back\"\n\nprint(transfer(1, 2, 30), transfer(1, 2, 500))\nprint(db.execute(\"SELECT id, bal FROM acct ORDER BY id\").fetchall())", "lang": "python", "out": "committed rolled back\n[(1, 70), (2, 80)]", "ill": false, "static": false, "pkgs": false, "pit": "Long-running transactions that hold locks and block other sessions.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/sqlite3.html#transaction-control", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 106, "t": "Indexes", "an": "The index at the back of a book: jump straight to the page instead of reading every page.", "ex": "An **index** is a separate sorted structure (usually a B-tree) that lets the database find rows without scanning the whole table. It speeds up reads and filters but slows writes and uses space. Check plans with `EXPLAIN` (`EXPLAIN ANALYZE` in PostgreSQL).", "code": "import sqlite3\ndb = sqlite3.connect(\":memory:\")\ndb.execute(\"CREATE TABLE logs(id INTEGER PRIMARY KEY, host TEXT, msg TEXT)\")\ndb.executemany(\"INSERT INTO logs(host, msg) VALUES (?, ?)\", [(f\"h{i % 50}\", \"x\") for i in range(5000)])\n\ndef plan():\n    return db.execute(\"EXPLAIN QUERY PLAN SELECT * FROM logs WHERE host = 'h7'\").fetchone()[3]\n\nprint(plan())\ndb.execute(\"CREATE INDEX idx_logs_host ON logs(host)\")\nprint(plan())", "lang": "python", "out": "SCAN logs\nSEARCH logs USING INDEX idx_logs_host (host=?)", "ill": false, "static": false, "pkgs": false, "pit": "Indexing every column. Index what you filter, join and sort on.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://www.postgresql.org/docs/current/indexes.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 107, "t": "Connection Pooling", "an": "A taxi rank: cars wait ready so you don't build a new one for every trip.", "ex": "Opening a database connection is slow, and servers cap them (`max_connections`). A **pool** keeps a set of open connections to borrow and return. Size it carefully: **pool size × application replicas** must stay under the server limit; use PgBouncer or a managed pooler when you need more clients.", "code": "from sqlalchemy import create_engine\n\nengine = create_engine(\n    \"postgresql+psycopg://app@db/app\",\n    pool_size=5, max_overflow=2,     # up to 7 connections per process\n    pool_pre_ping=True,              # test a connection before using it\n    pool_recycle=1800,               # replace connections older than 30 minutes\n)\nwith engine.connect() as conn:       # borrowed from the pool, returned on exit\n    ...", "lang": "python", "out": null, "ill": false, "static": true, "pkgs": false, "pit": null, "pro": null, "ops": "With 10 replicas × 7 connections = 70 connections, check that against Cloud SQL's `max_connections`.", "q": null, "a": null, "doc": "https://docs.sqlalchemy.org/en/20/core/pooling.html", "w": null, "mm": null, "skiprec": true, "pytest": false, "stdin": null}, {"n": 108, "t": "Migrations", "an": "Version-controlled renovation plans for the building's structure.", "ex": "A **migration** is a versioned script that changes the schema (add a column, create an index). **Alembic** generates and applies them in order (`upgrade`, `downgrade`). Review migrations like code, make them backwards-compatible (expand → migrate → contract) and run them in the deployment pipeline.", "code": "alembic init migrations\nalembic revision --autogenerate -m \"add servers table\"\nalembic upgrade head\nalembic downgrade -1", "lang": "bash", "out": null, "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": "In Argo CD this is a **PreSync hook** (a Job) that runs `alembic upgrade head` before the new app version rolls out.", "q": null, "a": null, "doc": "https://alembic.sqlalchemy.org/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}]}, {"id": 9, "short": "APIs", "title": "APIs and Networking", "icon": "🌐", "goal": "Speak HTTP fluently: requests and responses, the `requests` library, REST design, authentication, OAuth, building APIs with FastAPI, testing them, and real-time WebSockets.", "devops": "Everything in the cloud is an API: Kubernetes, GCP, Azure, Grafana, Argo CD. Writing robust clients (timeouts, retries, auth, pagination) and small internal APIs (webhooks, health checks, custom controllers) is core platform work.", "docs": [["http.client", "https://docs.python.org/3/library/http.client.html"], ["Requests", "https://requests.readthedocs.io/"], ["FastAPI", "https://fastapi.tiangolo.com/"], ["MDN HTTP", "https://developer.mozilla.org/en-US/docs/Web/HTTP"]], "mm": "sequenceDiagram\nparticipant C as Client\nparticipant S as Server\nC->>S: TLS handshake\nC->>S: GET /items with Authorization header\nS-->>C: 200 OK with JSON body\nC->>S: POST /items with JSON body\nS-->>C: 201 Created", "topics": [{"n": 109, "t": "HTTP Fundamentals", "an": "Sending a letter with a clear envelope (headers) and contents (body), and getting a reply with a status stamp.", "ex": "HTTP is request/response over TCP (HTTPS adds TLS, see the PKI guide). A **request** has a method (`GET`, `POST`, `PUT`, `PATCH`, `DELETE`), a URL, headers and an optional body. A **response** has a status code, headers and a body. `GET` is safe and idempotent; `PUT` and `DELETE` are idempotent; `POST` is not.", "code": "raw = \"HTTP/1.1 404 Not Found\\r\\nContent-Type: application/json\\r\\nContent-Length: 27\\r\\n\\r\\n{\\\"error\\\": \\\"pod not found\\\"}\"\nhead, _, body = raw.partition(\"\\r\\n\\r\\n\")\nstatus_line, *headers = head.split(\"\\r\\n\")\nprint(status_line.split(\" \", 2))\nprint(dict(h.split(\": \", 1) for h in headers))\nimport json\nprint(json.loads(body))", "lang": "python", "out": "['HTTP/1.1', '404', 'Not Found']\n{'Content-Type': 'application/json', 'Content-Length': '27'}\n{'error': 'pod not found'}", "ill": false, "static": false, "pkgs": false, "pit": "Ignoring status codes and assuming every response is a success.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview", "w": "http", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 110, "t": "Requests", "an": "A courier who delivers your request and brings back the answer.", "ex": "`requests` is the friendly HTTP client. Rules for production: always set a **timeout**, call `raise_for_status()`, reuse a `Session`, retry transient errors with backoff, and never log secrets. For async code use `httpx` or `aiohttp`.", "code": "import os, requests\nfrom requests.adapters import HTTPAdapter\nfrom urllib3.util.retry import Retry\n\ns = requests.Session()\nretry = Retry(total=3, backoff_factor=0.5, status_forcelist=[429, 502, 503, 504])\ns.mount(\"https://\", HTTPAdapter(max_retries=retry))\n\nr = s.get(\n    \"https://api.example.com/v1/clusters\",\n    params={\"env\": \"prod\"},\n    headers={\"Authorization\": f\"Bearer {os.environ['API_TOKEN']}\"},\n    timeout=10,                 # without a timeout a call can hang forever\n)\nr.raise_for_status()\nprint(r.json())", "lang": "python", "out": null, "ill": false, "static": true, "pkgs": false, "pit": "`requests.get(url)` with no timeout. It waits indefinitely.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://requests.readthedocs.io/en/latest/", "w": null, "mm": null, "skiprec": true, "pytest": false, "stdin": null}, {"n": 111, "t": "REST APIs", "an": "A restaurant menu: fixed dishes (resources), standard ways to order (verbs).", "ex": "REST models **resources** as nouns in URLs (`/clusters/42/nodes`) and uses HTTP verbs for actions. Good APIs use proper status codes, **pagination**, filtering, versioning (`/v1`), idempotency keys for safe retries, and consistent error bodies. The Kubernetes API is a REST API.", "code": "pages = {1: {\"items\": [\"a\", \"b\"], \"next\": 2}, 2: {\"items\": [\"c\"], \"next\": None}}\n\ndef fetch(page):                     # stands in for GET /items?page=N\n    return pages[page]\n\ndef all_items():\n    page = 1\n    while page:\n        data = fetch(page)\n        yield from data[\"items\"]\n        page = data[\"next\"]\n\nprint(list(all_items()))", "lang": "python", "out": "['a', 'b', 'c']", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": "`kubectl get --raw /api/v1/namespaces/default/pods` hits the same REST API your code can call.", "q": null, "a": null, "doc": "https://restfulapi.net/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 112, "t": "Authentication", "an": "Showing your passport (who you are) versus your boarding pass (what you may do).", "ex": "**Authentication** proves identity; **authorisation** decides permissions. Common schemes: API keys, Basic auth (only over TLS), **Bearer tokens** / **JWT** (signed claims), HMAC-signed requests, and **mTLS** client certificates (used by Kubernetes). Decoding a JWT is not verifying it: always check the signature.", "code": "import base64, hashlib, hmac, json\n\ndef b64(d):\n    return base64.urlsafe_b64encode(d).rstrip(b\"=\")\n\nsecret = b\"s3cret\"\nheader = b64(json.dumps({\"alg\": \"HS256\", \"typ\": \"JWT\"}).encode())\npayload = b64(json.dumps({\"sub\": \"elmi\", \"role\": \"admin\"}).encode())\nsig = b64(hmac.new(secret, header + b\".\" + payload, hashlib.sha256).digest())\ntoken = b\".\".join([header, payload, sig]).decode()\nprint(token.count(\".\"), json.loads(base64.urlsafe_b64decode(payload + b\"===\"))[\"sub\"])\nexpected = b64(hmac.new(secret, header + b\".\" + payload, hashlib.sha256).digest())\nprint(\"valid:\", hmac.compare_digest(sig, expected))", "lang": "python", "out": "2 elmi\nvalid: True", "ill": false, "static": false, "pkgs": false, "pit": "Trusting a token's contents without verifying its signature, or comparing secrets with `==` (timing attacks).", "pro": "Use a vetted library (PyJWT, Authlib) and `hmac.compare_digest`.", "ops": "Kubernetes ServiceAccount tokens are JWTs signed with `sa.key`, as covered in the PKI guide.", "q": null, "a": null, "doc": "https://developer.mozilla.org/en-US/docs/Web/HTTP/Authentication", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 113, "t": "OAuth", "an": "A valet key: it starts the car but doesn't open the glovebox, and you can revoke it.", "ex": "**OAuth 2.0** delegates access without sharing passwords. Use the **Authorization Code flow with PKCE** for apps and the **client-credentials** flow for machine-to-machine calls. **OpenID Connect** adds identity on top. PKCE proves the app that started the login is the one finishing it.", "code": "import base64, hashlib, secrets\nverifier = secrets.token_urlsafe(32)\nchallenge = base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b\"=\").decode()\nprint(len(verifier) >= 43, len(challenge))", "lang": "python", "out": "True 43", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": "Azure AD/Entra and Google Cloud both use OAuth 2.0 / OIDC: service principals use client credentials, CLI logins use the device or PKCE flows.", "q": null, "a": null, "doc": "https://oauth.net/2/", "w": null, "mm": "sequenceDiagram\nparticipant U as User\nparticipant A as App\nparticipant I as Identity Provider\nparticipant R as API\nA->>I: redirect with client_id and code_challenge\nU->>I: log in and consent\nI-->>A: authorization code\nA->>I: code and code_verifier\nI-->>A: access token\nA->>R: Bearer access token", "skiprec": false, "pytest": false, "stdin": null}, {"n": 114, "t": "FastAPI", "an": "A well-run front desk that validates every visitor's paperwork automatically.", "ex": "**FastAPI** builds APIs from type hints: path and query parameters, **Pydantic** models for request/response validation, dependency injection, async endpoints, and automatic OpenAPI docs at `/docs`. Run it with `uvicorn main:app`. Invalid input returns `422` for free.", "code": "from fastapi import FastAPI, HTTPException\nfrom fastapi.testclient import TestClient\nfrom pydantic import BaseModel\n\napp = FastAPI()\n\nclass Item(BaseModel):\n    name: str\n    replicas: int = 1\n\nDB: dict[str, Item] = {}\n\n@app.post(\"/items\", status_code=201)\nasync def create(item: Item):\n    DB[item.name] = item\n    return item\n\n@app.get(\"/items/{name}\")\nasync def read(name: str):\n    if name not in DB:\n        raise HTTPException(404, \"not found\")\n    return DB[name]\n\nc = TestClient(app)\nprint(c.post(\"/items\", json={\"name\": \"web\", \"replicas\": 3}).status_code)\nprint(c.get(\"/items/web\").json(), c.get(\"/items/nope\").status_code)\nprint(c.post(\"/items\", json={\"name\": \"x\", \"replicas\": \"many\"}).status_code)", "lang": "python", "out": "201\n{'name': 'web', 'replicas': 3} 404\n422", "ill": false, "static": true, "pkgs": true, "pit": null, "pro": null, "ops": "Expose `/healthz` and `/readyz` endpoints for Kubernetes probes, plus webhooks and small internal tools.", "q": null, "a": null, "doc": "https://fastapi.tiangolo.com/tutorial/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 115, "t": "API Testing", "an": "Rehearsing the conversation with a recorded actor instead of the real server.", "ex": "Test APIs at three levels: **unit** (logic), **contract/component** (the app with a test client, no network) and **integration** (real dependencies, few and slow). Use `TestClient` for your own API and `httpx.MockTransport` (or `respx`, `responses`) to fake outbound calls.", "code": "import httpx\n\ndef handler(request: httpx.Request) -> httpx.Response:\n    if request.url.path == \"/health\":\n        return httpx.Response(200, json={\"ok\": True})\n    return httpx.Response(404)\n\nclient = httpx.Client(transport=httpx.MockTransport(handler), base_url=\"http://svc\")\nprint(client.get(\"/health\").json(), client.get(\"/x\").status_code)", "lang": "python", "out": "{'ok': True} 404", "ill": false, "static": true, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": null, "a": null, "doc": "https://www.python-httpx.org/advanced/transports/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 116, "t": "WebSockets", "an": "A phone call that stays open, instead of sending letters back and forth.", "ex": "A **WebSocket** is a long-lived, two-way connection upgraded from HTTP: perfect for live dashboards, chat and streaming logs. In Python: FastAPI/Starlette, the `websockets` library, or `aiohttp`. Handle disconnects, heartbeats and back-pressure.", "code": "from fastapi import FastAPI, WebSocket, WebSocketDisconnect\nfrom fastapi.testclient import TestClient\n\napp = FastAPI()\n\n@app.websocket(\"/ws\")\nasync def ws(sock: WebSocket):\n    await sock.accept()\n    try:\n        while True:\n            msg = await sock.receive_text()\n            await sock.send_text(f\"echo:{msg}\")\n    except WebSocketDisconnect:\n        pass                    # the client closed the connection\n\nc = TestClient(app)\nwith c.websocket_connect(\"/ws\") as s:\n    s.send_text(\"hi\")\n    print(s.receive_text())", "lang": "python", "out": "echo:hi", "ill": false, "static": true, "pkgs": true, "pit": null, "pro": null, "ops": "`kubectl exec`, `logs -f` and `port-forward` stream over upgraded HTTP connections just like this.", "q": null, "a": null, "doc": "https://fastapi.tiangolo.com/advanced/websockets/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}]}, {"id": 10, "short": "Professional", "title": "Professional Engineering", "icon": "🏢", "goal": "Ship Python the way professionals do: packaging, dependency management with Poetry and uv, logging, configuration, secrets, observability, performance engineering, security, design and architecture patterns, clean code and refactoring.", "devops": "This is the SRE/platform phase: reproducible builds, 12-factor configuration, structured logs and metrics, secret hygiene, secure defaults, and architecture that keeps automation maintainable as it grows.", "docs": [["Python Packaging User Guide", "https://packaging.python.org/"], ["logging HOWTO", "https://docs.python.org/3/howto/logging.html"], ["uv", "https://docs.astral.sh/uv/"], ["Poetry", "https://python-poetry.org/docs/"]], "mm": "flowchart TB\nAPI[\"API layer: FastAPI\"] --> SVC[\"Service layer: business rules\"]\nSVC --> REPO[\"Repository interface\"]\nREPO --> DB[(\"PostgreSQL\")]\nSVC --> EXT[\"External clients: cloud and K8s APIs\"]\nSVC --> LOG[\"Logging, metrics, tracing\"]", "topics": [{"n": 117, "t": "Packaging", "an": "Putting your tool in a labelled box with instructions so anyone can install it.", "ex": "Modern packaging uses **`pyproject.toml`** (PEP 621) to declare name, version, dependencies and scripts, with a build backend (`hatchling`, `setuptools`, `flit`). Use the **src layout**. Build with `python -m build`, producing a wheel and sdist, and publish to PyPI or a private index. Click through a typical project.", "code": "import tomllib\ndoc = tomllib.loads(\"\"\"\n[project]\nname = \"fleet-tool\"\nversion = \"0.1.0\"\nrequires-python = \">=3.10\"\ndependencies = [\"requests>=2.31\", \"typer>=0.12\"]\n\n[project.scripts]\nfleet = \"fleet_tool.cli:app\"\n\n[build-system]\nrequires = [\"hatchling\"]\nbuild-backend = \"hatchling.build\"\n\"\"\")\nprint(doc[\"project\"][\"name\"], doc[\"project\"][\"scripts\"], doc[\"build-system\"][\"build-backend\"])", "lang": "python", "out": "fleet-tool {'fleet': 'fleet_tool.cli:app'} hatchling.build", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": null, "a": null, "doc": "https://packaging.python.org/en/latest/guides/writing-pyproject-toml/", "w": "tree", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 118, "t": "Poetry", "an": "A project manager who also handles shopping (dependencies) and shipping (publishing).", "ex": "**Poetry** manages virtual environments, resolves dependencies into a **lock file** (`poetry.lock`) and builds/publishes packages, all driven by `pyproject.toml`. Commit the lock file for applications.", "code": "poetry new fleet-tool\ncd fleet-tool\npoetry add requests\npoetry add --group dev pytest ruff\npoetry install\npoetry run pytest\npoetry lock", "lang": "bash", "out": null, "ill": false, "static": false, "pkgs": false, "pit": "Mixing plain `pip install` into a Poetry environment, so the lock file no longer describes reality.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://python-poetry.org/docs/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 119, "t": "uv", "an": "The same project manager, but rebuilt to be extremely fast.", "ex": "**uv** (from Astral, written in Rust) replaces `pip`, `venv`, `pip-tools`, `pipx` and even installs Python versions. It has a project workflow with a `uv.lock` file, `uv run`, and `uvx` for one-off tools.", "code": "uv init fleet-tool && cd fleet-tool\nuv add requests\nuv add --dev pytest ruff\nuv run pytest\nuv python install 3.12\nuv sync --frozen            # reproduce the exact locked environment (CI, Docker)", "lang": "bash", "out": null, "ill": false, "static": false, "pkgs": false, "pit": null, "pro": "Use `--frozen` / `--locked` in CI and container builds so nothing changes silently.", "ops": null, "q": null, "a": null, "doc": "https://docs.astral.sh/uv/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 120, "t": "Dependency Management", "an": "A shopping list with exact brands, so next month's meal tastes the same.", "ex": "Declare **ranges** in `pyproject.toml` (`requests>=2.31,<3`) and **pin exact versions** in a lock file for applications. Separate runtime and dev dependencies, audit regularly (`pip-audit`), automate updates (Dependabot or Renovate) and use hash checking for high-assurance builds.", "code": "pip install \"requests>=2.31,<3\"\npip freeze > requirements.lock\npip install --require-hashes -r requirements.txt\npip-audit                       # known-vulnerability scan", "lang": "bash", "out": null, "ill": false, "static": false, "pkgs": false, "pit": "Unpinned dependencies: a green build today breaks tomorrow when a new release appears.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://packaging.python.org/en/latest/tutorials/managing-dependencies/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 121, "t": "Logging", "an": "A flight recorder: it quietly records what happened so you can investigate afterwards.", "ex": "Use the `logging` module, not `print`. Loggers form a hierarchy by name (`logging.getLogger(__name__)`); **levels** filter importance; handlers decide where output goes; formatters decide how it looks. Pass arguments lazily (`log.info(\"x=%s\", x)`). Use JSON logs for aggregation.", "code": "import logging, sys\nlogging.basicConfig(stream=sys.stdout, level=logging.INFO,\n                    format=\"%(levelname)s %(name)s: %(message)s\")\nlog = logging.getLogger(\"deploy\")\nlog.debug(\"hidden at INFO level\")\nlog.info(\"starting %s\", \"web\")             # lazy formatting\nlog.warning(\"retrying (%d/3)\", 1)\ntry:\n    1 / 0\nexcept ZeroDivisionError as e:\n    log.error(\"failed: %s\", e)             # in real code: log.exception(...) adds the traceback", "lang": "python", "out": "INFO deploy: starting web\nWARNING deploy: retrying (1/3)\nERROR deploy: failed: division by zero", "ill": false, "static": false, "pkgs": false, "pit": "`print()` for diagnostics, eager f-strings in log calls, and logging secrets.", "pro": "Structured (JSON) logs with correlation IDs; log at the boundary where you handle the error, once.", "ops": "Logs flow to Loki/Elasticsearch/Cloud Logging, so consistent fields make dashboards and alerts possible.", "q": null, "a": null, "doc": "https://docs.python.org/3/howto/logging.html", "w": "log", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 122, "t": "Configuration Management", "an": "The settings panel on an appliance, so you don't rewire it for each kitchen.", "ex": "Follow the **12-factor** rule: config lives in the environment, not in code. Layer defaults < config file < environment variables < command-line flags. Validate once at start-up into a typed object (dataclass or Pydantic Settings) and fail fast.", "code": "import os\nfrom dataclasses import dataclass\n\n@dataclass(frozen=True)\nclass Settings:\n    env: str = \"dev\"\n    replicas: int = 1\n\n    @classmethod\n    def from_env(cls, environ=os.environ):\n        return cls(env=environ.get(\"APP_ENV\", cls.env),\n                   replicas=int(environ.get(\"APP_REPLICAS\", cls.replicas)))\n\nprint(Settings.from_env({}))\nprint(Settings.from_env({\"APP_ENV\": \"prod\", \"APP_REPLICAS\": \"3\"}))", "lang": "python", "out": "Settings(env='dev', replicas=1)\nSettings(env='prod', replicas=3)", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": "Pydantic Settings (`BaseSettings`) gives typed env loading with validation.", "ops": null, "q": null, "a": null, "doc": "https://12factor.net/config", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 123, "t": "Secrets Management", "an": "A safe deposit box, not a sticky note on the monitor.", "ex": "Never commit secrets to Git or bake them into images. Inject them at runtime from a secret manager (Vault, Azure Key Vault, GCP Secret Manager) or Kubernetes Secrets (base64 is **not** encryption). Generate with the `secrets` module, compare with `hmac.compare_digest`, redact in logs, rotate regularly, and give each service least-privilege access.", "code": "import os, secrets, hmac\n\ntoken = secrets.token_urlsafe(16)\nprint(len(token) >= 21)\n\ndef get_secret(name):\n    value = os.environ.get(name)\n    if value is None:\n        raise RuntimeError(f\"missing secret {name}\")\n    return value\n\ntry:\n    get_secret(\"DB_PASSWORD\")\nexcept RuntimeError as e:\n    print(e)\n\nprint(hmac.compare_digest(\"abc\", \"abc\"))\n\nclass Redacted(str):\n    def __repr__(self):\n        return \"'***'\"\n\nprint(repr(Redacted(\"hunter2\")))", "lang": "python", "out": "True\nmissing secret DB_PASSWORD\nTrue\n'***'", "ill": false, "static": false, "pkgs": false, "pit": "`password = \"hunter2\"` in source code, or printing a request that contains a token.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/secrets.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 124, "t": "Observability", "an": "Dashboard instruments in a cockpit: you can see inside without opening the engine.", "ex": "Observability rests on **logs** (events), **metrics** (numbers over time) and **traces** (a request's path across services). In Python: `logging`, `prometheus_client`, and **OpenTelemetry** for traces and metrics. Decorators are an ideal place to add instrumentation.", "code": "import functools\nfrom collections import Counter\n\nMETRICS = Counter()\n\ndef instrument(fn):\n    @functools.wraps(fn)\n    def wrapper(*a, **k):\n        METRICS[f\"{fn.__name__}_calls\"] += 1\n        try:\n            return fn(*a, **k)\n        except Exception:\n            METRICS[f\"{fn.__name__}_errors\"] += 1\n            raise\n    return wrapper\n\n@instrument\ndef deploy(ok):\n    if not ok:\n        raise RuntimeError(\"failed\")\n\ndeploy(True)\ntry:\n    deploy(False)\nexcept RuntimeError:\n    pass\nprint(dict(METRICS))", "lang": "python", "out": "{'deploy_calls': 2, 'deploy_errors': 1}", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops":
