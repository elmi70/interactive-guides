<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python: Zero to Mastery · Interactive Guide</title>
<style>
:root{--bg:#f4f6fb;--ink:#1d2433;--muted:#667085;--blue:#306998;--blue2:#4b8bbe;--yel:#ffd43b;--green:#12b76a;--red:#f04438;--amber:#f79009;--purple:#7a5af8;--line:#e4e7ec}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(130deg,#254e70,#306998 45%,#4b8bbe);color:#fff;padding:30px 16px 64px;text-align:center}
header h1{margin:0;font-size:clamp(28px,5.5vw,54px);letter-spacing:-.5px}header h1 span{color:var(--yel)}
header p{max-width:820px;margin:8px auto 0;opacity:.95}
#tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:10px 10px;margin:-38px auto 14px;max-width:1280px;scrollbar-width:thin}
#tabs button{flex:0 0 auto;border:0;border-radius:999px;background:#fff;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 3px 12px #0002;white-space:nowrap}
#tabs button.on{background:var(--yel)}
main{max-width:1180px;margin:auto;padding:0 14px 70px}
.page{display:none}.page.on{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:14px 0;box-shadow:0 4px 18px #1018280a}
h2{margin:0 0 10px}h3{margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.box{border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.muted{color:var(--muted);font-size:.92em}
.btn{border:0;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;cursor:pointer;color:#fff;background:#475467;margin:3px 4px 3px 0}
.btn.g{background:var(--green)}.btn.p{background:var(--purple)}.btn:disabled{opacity:.35;cursor:not-allowed}
code{background:#eef2f6;border-radius:5px;padding:1px 5px;font-family:ui-monospace,Consolas,monospace;font-size:.92em}
pre{margin:0;font-family:ui-monospace,Consolas,monospace}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #cfd4dc;border-radius:8px;background:#fff}
input[type=checkbox],input[type=range]{padding:0}
label{margin-right:10px}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:6px 0}
.callout{padding:10px 12px;border-radius:10px;background:#eff8ff;border-left:5px solid var(--blue2);margin:10px 0}
table.compare{border-collapse:collapse;width:100%}table.compare th,table.compare td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}table.compare th{background:#f8fafc}
.diagram{overflow:auto;text-align:center}.diagram pre.mermaid{min-width:560px;background:none}
.pbar{height:9px;background:#e4e7ec;border-radius:9px;overflow:hidden;margin:6px 0}.pbar div{height:100%;background:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
/* topic cards */
details.topic{background:#fff;border:1px solid var(--line);border-radius:14px;margin:9px 0;box-shadow:0 2px 10px #1018280a}
details.topic>summary{cursor:pointer;padding:11px 14px;font-weight:700;display:flex;align-items:center;gap:9px;list-style:none}
details.topic>summary::-webkit-details-marker{display:none}
details.topic[open]>summary{border-bottom:1px solid var(--line);background:#fafbfd;border-radius:14px 14px 0 0}
.num{background:var(--blue);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;min-width:32px;text-align:center}
.tt{flex:1}.tick{color:var(--green);font-size:18px}
.badge{font-size:11px;background:#e0ecf7;color:var(--blue);border-radius:6px;padding:1px 6px;font-weight:700}.badge.w{background:#fff3cd;color:#8a6100}
.tbody{padding:6px 16px 14px}
.sec{margin:12px 0;border-left:4px solid var(--line);padding-left:12px}
.sec .lab{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.3px;color:#475467;margin-bottom:3px}
.sec.an{border-color:#f79009}.sec.ex{border-color:var(--blue2)}.sec.wd{border-color:var(--purple)}.sec.cd{border-color:var(--green)}.sec.pit{border-color:var(--red)}.sec.pro{border-color:#12b76a}.sec.ops{border-color:#0ba5ec}.sec.chk{border-color:#7a5af8}.sec.mm{border-color:#98a2b3}
.learned{display:inline-block;margin-top:8px;background:#ecfdf3;border:1px solid #abefc6;border-radius:999px;padding:5px 12px;font-weight:700;cursor:pointer}
/* runner */
.runner{border:1px solid #d0d5dd;border-radius:12px;overflow:hidden;background:#fff}
.rhead{display:flex;justify-content:space-between;align-items:center;background:#1d2433;color:#e4e7ec;padding:5px 10px;font-size:12px;font-weight:700}
.rhead .btn{padding:3px 10px;margin:0 0 0 5px}
.runner textarea{display:block;width:100%;border:0;border-radius:0;background:#0f172a;color:#e6edf3;font:13px/1.5 ui-monospace,Consolas,monospace;resize:vertical;white-space:pre;overflow:auto;tab-size:4}
.olabel{font-size:12px;color:var(--muted);padding:5px 10px;background:#f8fafc}
.runner pre.out{background:#fff;color:#0b3d2e;padding:8px 12px;border-top:1px solid var(--line);white-space:pre-wrap;font-size:13px;max-height:340px;overflow:auto}
/* widgets */
.widget{background:#faf7ff;border:1px solid #e9d7fe;border-radius:12px;padding:10px 12px}
.step{border-left:5px solid var(--purple);background:#f4f0ff;border-radius:8px;padding:9px 12px;margin:8px 0}
.wout{margin-top:6px}
.code,pre.code{background:#101828;color:#e4e7ec;border-radius:10px;padding:10px 12px;overflow:auto;font-size:13px;margin:6px 0}
.code .hl{background:#fde68a;color:#111;display:inline-block;width:100%}
.cells{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0}
.cell{width:34px;text-align:center;border:1px solid #d0d5dd;border-radius:6px;background:#fff;font-family:ui-monospace,Consolas,monospace}
.cell.on{background:#fde68a;border-color:#f79009}.cell .ix{font-size:11px;color:#175cd3}.cell .nx{font-size:11px;color:#b42318}
.tbline{padding:4px 8px;margin:2px 0;border-radius:6px;cursor:pointer;background:#fff;border:1px solid var(--line);font-size:12.5px;white-space:pre-wrap}.tbline.sel{background:#fff3cd;border-color:var(--amber)}
.frame{border:2px solid var(--blue2);background:#eaf4fb;border-radius:8px;padding:5px 10px;margin:3px 0;font-family:ui-monospace,Consolas,monospace}
.alias{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin:8px 0}
.ob{display:inline-block;border-radius:8px;padding:2px 9px;margin:2px 0;font-family:ui-monospace,Consolas,monospace;border:1px solid #0002}.alias .ob{display:block}.nm{margin:3px 0}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bl{width:130px;font-weight:700;font-size:13px}.bf{color:#fff;border-radius:6px;padding:3px 8px;font-weight:700;font-size:13px;min-width:48px;transition:width .3s}
.lg{padding:4px 8px;border-radius:6px;margin:3px 0}.lg.on{background:#ecfdf3}.lg.off{background:#f2f4f7;color:#98a2b3}
.tree{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;font-family:ui-monospace,Consolas,monospace;font-size:13px}.tnode{padding:2px 6px;border-radius:5px;cursor:pointer;white-space:pre}.tnode:hover{background:#eef2f6}.tnode.sel{background:#fde68a}
textarea.mini{width:100%;font-family:ui-monospace,Consolas,monospace}
/* quiz */
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin:4px 0;cursor:pointer;font:inherit}
.opt.good{border-color:var(--green);background:#ecfdf3}.opt.bad{border-color:var(--red);background:#fef3f2}
.chk{display:block;padding:6px 10px;border-radius:8px;background:#f8fafc;margin:4px 0}
details.iv{border:1px solid var(--line);border-radius:10px;margin:6px 0;padding:8px 12px}details.iv summary{cursor:pointer;font-weight:700}.ans{background:#ecfdf3;border-left:4px solid var(--green);padding:6px 10px;border-radius:6px;margin-top:6px}
@media(max-width:700px){.alias{grid-template-columns:1fr}.card{padding:14px}.bl{width:96px}}
</style></head>

<script id="data" type="application/json">{"meta": {"pyver": "3.12.15", "roadmap": "flowchart LR\nsubgraph L1[\"Learn the language\"]\nP1[\"1 Foundations\"] --> P2[\"2 Core Python\"] --> P3[\"3 Intermediate\"] --> P4[\"4 OOP\"]\nend\nsubgraph L2[\"Build real programs\"]\nP5[\"5 Files and data\"] --> P6[\"6 Testing\"] --> P7[\"7 Advanced\"]\nend\nsubgraph L3[\"Build systems\"]\nP8[\"8 Databases\"] --> P9[\"9 APIs\"] --> P10[\"10 Professional\"]\nend\nsubgraph L4[\"Specialise and master\"]\nP11[\"11 Data\"] --> P12[\"12 Expert\"] --> CAP[\"Capstone\"]\nend\nL1 --> L2 --> L3 --> L4"}, "phases": [{"id": 1, "short": "Foundations", "title": "Foundations", "icon": "🧱", "goal": "Understand what programming is, set up a clean Python environment, and master the basic building blocks: variables, types, operators, decisions, loops, functions, modules and debugging.", "devops": "Every automation script has the same skeleton you learn here: **read input → decide → loop over things → call functions → report errors**. A clean virtual environment per project is how platform teams keep scripts reproducible.", "docs": [["Python Tutorial", "https://docs.python.org/3/tutorial/index.html"], ["Library Reference", "https://docs.python.org/3/library/index.html"], ["PEP 8 style guide", "https://peps.python.org/pep-0008/"]], "mm": null, "topics": [{"n": 1, "t": "Introduction to Programming", "an": "A recipe: exact steps that a very literal cook can follow.", "ex": "A program is a list of exact instructions. A computer does precisely what you write, not what you mean. Almost every program has three parts: **input**, **processing** and **output**. Programming is breaking a problem into steps small enough for a machine.", "code": "# input -> processing -> output\ncelsius = 21\nfahrenheit = celsius * 9 / 5 + 32\nprint(celsius, \"C is\", fahrenheit, \"F\")", "lang": "python", "out": "21 C is 69.8 F", "ill": false, "static": false, "pkgs": false, "pit": "Typing code before understanding the problem. Solve a small example by hand first.", "pro": "Write the steps in plain English (pseudocode), then translate each line into Python.", "ops": "An automation script has the same shape: read config (input), compute the changes (processing), call an API (output).", "q": "What are the three parts of almost every program?", "a": "Input, processing and output.", "doc": "https://docs.python.org/3/tutorial/introduction.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 2, "t": "What Python Is", "an": "A very readable general-purpose language, like clear prose compared with legal text.", "ex": "Python is a **high-level, dynamically typed, garbage-collected, multi-paradigm** language. The standard implementation is **CPython**, written in C. Your source is compiled to bytecode which a virtual machine runs. Strengths: readability and a huge ecosystem. Trade-off: raw speed.", "code": "import sys, platform\nprint(sys.version_info >= (3, 10))\nprint(platform.python_implementation())", "lang": "python", "out": "True\nCPython", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": "What is CPython?", "a": "The reference implementation of Python, written in C.", "doc": "https://docs.python.org/3/faq/general.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 3, "t": "Installing Python", "an": "Setting up your workshop before you build anything.", "ex": "On WSL/Ubuntu or Linux use the system `python3` plus a **virtual environment**. On Windows use the python.org installer or the Microsoft Store. Version managers such as `uv` or `pyenv` install several Python versions side by side. Never `sudo pip install` into the system Python.", "code": "python3 --version\npython3 -m venv .venv\nsource .venv/bin/activate      # Windows PowerShell: .venv\\Scripts\\Activate.ps1\npython -m pip install --upgrade pip\nwhich python                   # should point inside .venv", "lang": "bash", "out": null, "ill": false, "static": false, "pkgs": false, "pit": "Installing packages globally and breaking OS tools that depend on the system Python.", "pro": "One virtual environment per project, and pin the Python version the project supports.", "ops": "In WSL Ubuntu the OS tools (`apt`, `az`, `gcloud`) use their own Python. Keep your project libraries in `.venv`.", "q": null, "a": null, "doc": "https://docs.python.org/3/using/index.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 4, "t": "Jupyter Notebooks", "an": "A lab notebook where you write notes and run experiments side by side.", "ex": "A notebook is a document of **cells**: Markdown cells for explanation and code cells that run in a shared **kernel**, so variables persist between cells. Great for learning and exploring data. Weak for production code, because hidden state and out-of-order runs make results hard to reproduce.", "code": "pip install jupyterlab\njupyter lab                    # opens the notebook server in your browser", "lang": "bash", "out": null, "ill": false, "static": false, "pkgs": false, "pit": "Running cells out of order and relying on hidden state. Always *Restart kernel and Run all* before trusting a result.", "pro": "Explore in notebooks, then move reusable logic into `.py` modules and import it.", "ops": null, "q": null, "a": null, "doc": "https://docs.jupyter.org/en/latest/", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 5, "t": "VS Code", "an": "A well-equipped workbench: editor, debugger and terminal in one place.", "ex": "Install the **Python** extension (it bundles Pylance), choose the interpreter with `Ctrl+Shift+P` → *Python: Select Interpreter* (pick `.venv`), then use the integrated terminal, the debugger (breakpoints, watch, call stack) and the Testing panel. On Windows use the **WSL** extension so VS Code runs inside Linux.", "code": "cd ~/projects/fleet-tool\ncode .                         # opens VS Code connected to WSL", "lang": "bash", "out": null, "ill": false, "static": false, "pkgs": false, "pit": null, "pro": "Commit shared settings (formatter on save, test paths) in `.vscode/settings.json`; keep personal ones out.", "ops": null, "q": null, "a": null, "doc": "https://code.visualstudio.com/docs/python/python-tutorial", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 6, "t": "How Python Executes Code", "an": "A translator writes a simplified script (bytecode); an actor (the virtual machine) then performs it line by line.", "ex": "CPython pipeline: **source → tokens → AST → bytecode → virtual machine**. Bytecode may be cached in `__pycache__/*.pyc`. Python runs a file top to bottom. `def` and `class` are statements that run when reached and create objects.", "code": "print(\"1: module starts\")\ndef greet():\n    print(\"3: inside greet\")\nprint(\"2: def only created the function\")\ngreet()\nprint(\"4: done\")", "lang": "python", "out": "1: module starts\n2: def only created the function\n3: inside greet\n4: done", "ill": false, "static": false, "pkgs": false, "pit": "Assuming a function runs when it is defined. It only runs when it is called.", "pro": null, "ops": null, "q": "When does the body of a `def` execute?", "a": "When the function is called, never at definition time.", "doc": "https://docs.python.org/3/reference/executionmodel.html", "w": null, "mm": "flowchart LR\nA[\"main.py source\"] --> B[\"Parser: tokens and AST\"] --> C[\"Compiler: bytecode\"] --> D[\"Python Virtual Machine\"] --> E[\"Output\"]\nC -.cached.-> F[\"__pycache__ .pyc\"]", "skiprec": false, "pytest": false, "stdin": null}, {"n": 7, "t": "Variables", "an": "Name tags you stick on objects, not boxes that contain values.", "ex": "`x = 5` binds the **name** `x` to an int object. Assignment never copies; it attaches a name. Names are case-sensitive, use `snake_case` by convention, cannot be keywords, and can be rebound to any type (dynamic typing).", "code": "x = 5\nprint(type(x))\nx = \"now a string\"\nprint(type(x))\na, b = 1, 2\na, b = b, a          # swap without a temporary\nprint(a, b)", "lang": "python", "out": "<class 'int'>\n<class 'str'>\n2 1", "ill": false, "static": false, "pkgs": false, "pit": "Thinking variables hold values like boxes. That model breaks the moment you meet lists (topic 44).", "pro": "Descriptive snake_case names (`retry_count`, not `rc`); UPPER_CASE for constants.", "ops": "Terraform variables are typed inputs. Python names are only labels, so validate inputs yourself.", "q": "Does `b = a` copy the object?", "a": "No. It binds a second name to the same object.", "doc": "https://docs.python.org/3/tutorial/introduction.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 8, "t": "Data Types", "an": "Different containers for different jobs: a number is not a sentence.", "ex": "Core types: `int` (arbitrary precision), `float` (binary, approximate), `complex`, `str`, `bool`, `NoneType`, `bytes`, plus `list`, `tuple`, `dict`, `set`. Inspect with `type(x)` and `isinstance(x, T)`.", "code": "for v in (42, 3.14, \"hi\", True, None, [1], (1,), {\"a\": 1}, {1}, b\"x\"):\n    print(f\"{v!r:10} -> {type(v).__name__}\")\nprint(0.1 + 0.2 == 0.3)\nprint(2 ** 100)", "lang": "python", "out": "42         -> int\n3.14       -> float\n'hi'       -> str\nTrue       -> bool\nNone       -> NoneType\n[1]        -> list\n(1,)       -> tuple\n{'a': 1}   -> dict\n{1}        -> set\nb'x'       -> bytes\nFalse\n1267650600228229401496703205376", "ill": false, "static": false, "pkgs": false, "pit": "Comparing floats with `==`. Use `math.isclose` or `decimal`.", "pro": "`Decimal` for money; `isinstance` instead of `type(x) == ...`.", "ops": null, "q": "Why is `0.1 + 0.2 != 0.3`?", "a": "Floats are binary approximations of decimal fractions.", "doc": "https://docs.python.org/3/library/stdtypes.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 9, "t": "Input and Output", "an": "A conversation: you listen (input) and you speak (output).", "ex": "`print()` writes to stdout (`sep`, `end`, `file=`). `input()` reads one line as a **str**, so convert it. Real scripts prefer command-line arguments, files and environment variables over prompting. The example fakes the keyboard with `io.StringIO` so it runs anywhere.", "code": "import sys, io\nsys.stdin = io.StringIO(\"Elmi\\n3\\n\")      # simulate a user typing\nname = input(\"Name? \")\ncount = int(input(\"Count? \"))\nprint()                                   # your Enter key would have ended the prompt line\nprint(f\"Hello {name}!\", \"*\" * count, sep=\" | \")\nprint(\"to stderr\", file=sys.stderr)", "lang": "python", "out": "Name? Count? \nHello Elmi! | ***\nto stderr", "ill": false, "static": false, "pkgs": false, "pit": "Forgetting that `input()` returns `str`: `'3' + 1` raises TypeError.", "pro": "Use `argparse` for scripts so they work in CI where nobody can type.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/inputoutput.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 10, "t": "Operators", "an": "The verbs of the language: add, compare, combine.", "ex": "Arithmetic `+ - * / // % **`. Comparison `== != < > <= >=` (chainable: `0 < x < 10`). Logical `and or not` return one of their operands and short-circuit. Membership `in`, identity `is`. Bitwise `& | ^ ~ << >>`. Augmented `+=`. Walrus `:=` assigns inside an expression.", "code": "print(7 / 2, 7 // 2, 7 % 2, 2 ** 10)\nprint(-7 // 2, -7 % 2)               # floor semantics, not truncation\nprint(0 < 5 < 10)\nprint(None or \"default\", 0 and \"x\")\nif (n := len(\"platform\")) > 5:\n    print(\"long:\", n)", "lang": "python", "out": "3.5 3 1 1024\n-4 1\nTrue\ndefault 0\nlong: 8", "ill": false, "static": false, "pkgs": false, "pit": "Using `is` to compare values. Use `==`, and reserve `is` for `None`.", "pro": null, "ops": null, "q": "What does `-7 // 2` return?", "a": "-4, because `//` floors toward negative infinity.", "doc": "https://docs.python.org/3/reference/expressions.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 11, "t": "Booleans", "an": "A light switch with a few surprising 'off' positions.", "ex": "`True` and `False` are `bool`, a subclass of `int`. Every object has **truthiness**. The falsy values are `False, None, 0, 0.0, 0j, '', [], {}, (), set(), range(0)`. Everything else is truthy.", "code": "print(True + True, isinstance(True, int))\nprint(bool([]), bool([0]), bool(\"\"), bool(\"False\"))\nprint(all([]), any([]))", "lang": "python", "out": "2 True\nFalse True False True\nTrue False", "ill": false, "static": false, "pkgs": false, "pit": "Writing `if x == True:`. Write `if x:`. But use `if x is not None:` when `0` or `''` are valid values.", "pro": "Prefer explicit `is None` checks when `None` has meaning.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/stdtypes.html#truth-value-testing", "w": "truthy", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 12, "t": "Conditional Logic", "an": "A fork in the road with signposts.", "ex": "`if / elif / else` chooses a branch. The conditional expression is `a if cond else b`. Indentation (4 spaces) defines blocks. Prefer **guard clauses** (return early) over deep nesting.", "code": "def classify(replicas):\n    if replicas < 0:\n        raise ValueError(\"negative\")\n    if replicas == 0:\n        return \"stopped\"\n    elif replicas < 3:\n        return \"small\"\n    return \"large\"\n\nfor r in (0, 2, 5):\n    print(r, classify(r))\nprint(\"ok\" if classify(1) == \"small\" else \"no\")", "lang": "python", "out": "0 stopped\n2 small\n5 large\nok", "ill": false, "static": false, "pkgs": false, "pit": "Missing colon or mixed tabs and spaces: SyntaxError or IndentationError.", "pro": "Guard clauses; no more than two or three levels of nesting.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/controlflow.html#if-statements", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 13, "t": "Loops", "an": "Doing the same chore for every item on a list.", "ex": "`for` iterates over any iterable; `while` repeats while a condition holds. `break` exits, `continue` skips, and a loop's `else` runs only if no `break` happened. Prefer `for x in items` over index loops and use `enumerate` and `zip`.", "code": "for i, host in enumerate([\"web1\", \"web2\", \"db1\"], start=1):\n    print(i, host)\nfor attempt in range(1, 4):\n    if attempt == 3:\n        print(\"success on\", attempt)\n        break\nelse:\n    print(\"never succeeded\")\nn = 3\nwhile n:\n    print(\"T-minus\", n)\n    n -= 1", "lang": "python", "out": "1 web1\n2 web2\n3 db1\nsuccess on 3\nT-minus 3\nT-minus 2\nT-minus 1", "ill": false, "static": false, "pkgs": false, "pit": "Modifying a list while iterating over it.", "pro": "Iterate directly and build a new list instead of mutating during the loop.", "ops": "`for attempt in range(...)` with an `else` is the standard shape for polling an API until it is ready.", "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/controlflow.html#for-statements", "w": "range", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 14, "t": "Functions", "an": "A named recipe card you can reuse with different ingredients.", "ex": "`def name(params): ...` packages logic. Parameters receive **arguments**; `return` sends a value back (`None` if absent). Functions are objects you can assign and pass around. Write small functions that do one thing, with a docstring.", "code": "import math\n\ndef scale(replicas: int, factor: float = 1.5) -> int:\n    \"\"\"Return replicas scaled by factor, rounded up.\"\"\"\n    return math.ceil(replicas * factor)\n\nprint(scale(3), scale(3, factor=2))\nprint(scale.__doc__)", "lang": "python", "out": "5 6\nReturn replicas scaled by factor, rounded up.", "ill": false, "static": false, "pkgs": false, "pit": "Printing inside functions instead of returning values, which makes them hard to test and reuse.", "pro": "Pure functions where possible; type hints and docstrings.", "ops": "Every automation script is a composition of small functions: `get_disks()`, `is_unused()`, `delete()`.", "q": "What does a function without `return` give back?", "a": "`None`.", "doc": "https://docs.python.org/3/tutorial/controlflow.html#defining-functions", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 15, "t": "Modules", "an": "A toolbox you borrow from a shelf.", "ex": "Any `.py` file is a module. `import x` runs it once and caches it in `sys.modules`; `from x import y` binds a name. Import order: standard library, third-party, local. Use `if __name__ == \"__main__\":` to separate import-time code from script behaviour.", "code": "import math, json as j\nfrom collections import Counter\nprint(math.sqrt(16), j.dumps({\"a\": 1}), Counter(\"banana\").most_common(1))\nprint(__name__)", "lang": "python", "out": "4.0 {\"a\": 1} [('a', 3)]\n__main__", "ill": false, "static": false, "pkgs": false, "pit": "`from module import *` pollutes the namespace, and naming your file `random.py` shadows the standard library.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/modules.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 16, "t": "Packages", "an": "A filing cabinet of toolboxes.", "ex": "A **package** is a directory of modules (normally with `__init__.py`). Import with dotted paths: `import pkg.sub.mod`. Use absolute imports; use relative imports (`from . import x`) only inside a package.", "code": "import sys, shutil, pathlib\nroot = pathlib.Path(\"demo_pkgs\")\n(root / \"tools\").mkdir(parents=True, exist_ok=True)\n(root / \"tools\" / \"__init__.py\").write_text(\"VERSION = '1.0'\\n\")\n(root / \"tools\" / \"util.py\").write_text(\"def hello():\\n    return 'hi from util'\\n\")\nsys.path.insert(0, str(root))\nimport tools, tools.util as u\nprint(u.hello(), tools.VERSION)\nsys.path.remove(str(root))\nfor m in (\"tools\", \"tools.util\"):\n    sys.modules.pop(m, None)\nshutil.rmtree(root)", "lang": "python", "out": "hi from util 1.0", "ill": false, "static": false, "pkgs": false, "pit": "Running a file inside a package directly breaks relative imports. Use `python -m package.module`.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/modules.html#packages", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 17, "t": "Virtual Environments", "an": "A private workbench per project so tools never get mixed up.", "ex": "`python -m venv .venv` creates an isolated interpreter and `site-packages`. Activate it, `pip install` into it, and freeze dependencies. Add `.venv/` to `.gitignore`. Tools: `venv`, `virtualenv`, `uv venv`, Poetry.", "code": "python3 -m venv .venv\nsource .venv/bin/activate\npip install requests\npip freeze > requirements.txt\ndeactivate", "lang": "bash", "out": null, "ill": false, "static": false, "pkgs": false, "pit": "Forgetting to activate, then installing into the wrong Python. Check with `which python` and `pip -V`.", "pro": "`python -m pip` guarantees that pip matches the interpreter you are using.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/venv.html", "w": null, "mm": "flowchart LR\nA[\"python -m venv .venv\"] --> B[\"source .venv/bin/activate\"] --> C[\"pip install requests\"] --> D[\"python script.py uses .venv only\"]", "skiprec": false, "pytest": false, "stdin": null}, {"n": 18, "t": "Debugging Basics", "an": "Being a detective: reproduce, narrow down, confirm.", "ex": "Method: **reproduce → read the error → isolate → hypothesise → test → fix → add a test**. Tools: `print`/`logging`, `breakpoint()` (opens `pdb`), the VS Code debugger, and `assert` for assumptions. Bisect by halving the code until the bug disappears.", "code": "def average(xs):\n    total = sum(xs)\n    # breakpoint()   # uncomment locally: n=next, s=step, p x=print, c=continue, q=quit\n    return total / len(xs)\n\nprint(average([2, 4, 6]))\ntry:\n    print(average([]))\nexcept ZeroDivisionError as e:\n    print(\"bug found:\", e)", "lang": "python", "out": "4.0\nbug found: division by zero", "ill": false, "static": false, "pkgs": false, "pit": "Changing code randomly and hoping it works. Form a hypothesis first.", "pro": "Write a failing test that reproduces the bug before you fix it.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/pdb.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 19, "t": "Reading Error Messages", "an": "A GPS that tells you exactly which turn you missed. Read it from the bottom.", "ex": "Read a traceback from the **bottom**: the last line is the exception type and message; the frame just above it is where it was raised; the frames above show the call path (oldest first).", "code": null, "lang": "python", "out": null, "ill": false, "static": false, "pkgs": false, "pit": null, "pro": "Search the exact exception message, then read the library source around the line that raised it.", "ops": null, "q": "Which line of a traceback names the error?", "a": "The last line.", "doc": "https://docs.python.org/3/tutorial/errors.html", "w": "trace", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 20, "t": "Working with Documentation", "an": "Reading the manual that came with the appliance.", "ex": "Learn to read signatures: `sorted(iterable, /, *, key=None, reverse=False)` means `iterable` is positional-only and `key`, `reverse` are keyword-only. Use `help(obj)`, `dir(obj)`, `obj.__doc__`. On docs.python.org: **Tutorial** = learn, **Library Reference** = look up, **Language Reference** = rules, **HOWTOs** = deep dives.", "code": "import inspect\nprint(inspect.signature(sorted))\nprint(inspect.signature(str.split))\nprint([n for n in dir(list) if not n.startswith(\"_\")][:5])", "lang": "python", "out": "(iterable, /, *, key=None, reverse=False)\n(self, /, sep=None, maxsplit=-1)\n['append', 'clear', 'copy', 'count', 'extend']", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": "Read the docs first, then the source, then Stack Overflow. Official docs are always version-specific.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/inspect.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}]}, {"id": 2, "short": "Core Python", "title": "Core Python", "icon": "⚙️", "goal": "Master Python's built-in data structures and the idioms that make code Pythonic: strings, lists, tuples, sets, dicts, comprehensions, iterators, generators, functional tools, sorting, searching, recursion and pattern matching.", "devops": "Real infrastructure data is **dicts and lists**: Kubernetes manifests, Terraform state, cloud API responses, `kubectl -o json`. Generators stream logs, sets reconcile desired vs actual state, and comprehensions filter fleets of resources in one line.", "docs": [["Data structures tutorial", "https://docs.python.org/3/tutorial/datastructures.html"], ["Built-in types", "https://docs.python.org/3/library/stdtypes.html"], ["Functional HOWTO", "https://docs.python.org/3/howto/functional.html"]], "mm": null, "topics": [{"n": 21, "t": "Strings", "an": "A necklace of letters: you can read any bead, but you cannot swap one in place.", "ex": "`str` is an immutable sequence of Unicode characters. Index (`s[0]`), slice (`s[2:5]`), and use methods (`split`, `join`, `strip`, `replace`, `startswith`, `find`). **f-strings** format values: `f\"{x:.2f}\"`. `bytes` is the raw-bytes cousin; convert with `.encode()` / `.decode()`.", "code": "s = \"Platform\"\nprint(s[0], s[-1], s[2:5], s[::-1])\nprint(s.upper(), s.lower(), s.replace(\"a\", \"@\"))\nprint(\" a,b ,c \".strip().split(\",\"))\nprint(\"-\".join([\"x\", \"y\", \"z\"]), \"form\" in s.lower())\nname, n = \"web\", 3.14159\nprint(f\"{name:>6}|{n:.2f}|{n:08.3f}|{1234567:,}\")\nprint(\"é\".encode(\"utf-8\"), len(\"é\"), len(\"é\".encode()))", "lang": "python", "out": "P m atf mroftalP\nPLATFORM platform Pl@tform\n['a', 'b ', 'c']\nx-y-z True\n   web|3.14|0003.142|1,234,567\nb'\\xc3\\xa9' 1 2", "ill": false, "static": false, "pkgs": false, "pit": "Building strings with `+=` in a loop. Use `''.join(parts)`.", "pro": "f-strings for formatting; `removeprefix` / `removesuffix`; never build SQL or shell commands with f-strings.", "ops": "Log parsing is string work: `line.split()`, `partition`, regular expressions.", "q": "What does `'Platform'[::-1]` return?", "a": "`'mrofsalP'`, the reversed string.", "doc": "https://docs.python.org/3/library/stdtypes.html#text-sequence-type-str", "w": "slice", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 22, "t": "Lists", "an": "A numbered shopping list you can edit freely.", "ex": "`list` is an ordered, mutable sequence. Add with `append`, `extend`, `insert`; remove with `pop`, `remove`, `del`. Sort with `sort()` (in place) or `sorted()` (new list). Unpack with `a, *rest = xs`.", "code": "xs = [3, 1, 4]\nxs.append(1)\nxs.extend([5, 9])\nxs.insert(0, 0)\nprint(xs)\nlast = xs.pop()\nprint(last, xs.index(4), xs.count(1))\nprint(sorted(xs), xs[::2], len(xs))\nys = xs.copy()\nys.sort(reverse=True)\nprint(ys)", "lang": "python", "out": "[0, 3, 1, 4, 1, 5, 9]\n9 3 2\n[0, 1, 1, 3, 4, 5] [0, 1, 1] 6\n[5, 4, 3, 1, 1, 0]", "ill": false, "static": false, "pkgs": false, "pit": "Using a list as a queue with `pop(0)`, which is O(n). Use `collections.deque`.", "pro": "Know the cost of each operation (see the widget). Choose the container for the access pattern.", "ops": "A list of dicts is the shape of `kubectl get pods -o json` → `items`.", "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/datastructures.html#more-on-lists", "w": "bigo", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 23, "t": "Tuples", "an": "A sealed envelope: contents fixed once packed.", "ex": "An immutable ordered sequence, hashable if all its items are. Used for fixed records, dict keys, multiple return values and unpacking. `(1,)` needs the trailing comma. Use `namedtuple` or a dataclass when fields need names.", "code": "point = (3, 4)\nx, y = point\nfirst, *rest = (1, 2, 3, 4)\nprint(x, y, first, rest)\nprint({(0, 0): \"origin\"}[(0, 0)])\n\ndef min_max(xs):\n    return min(xs), max(xs)\n\nprint(min_max([3, 1, 2]), type((1,)), type((1)))", "lang": "python", "out": "3 4 1 [2, 3, 4]\norigin\n(1, 3) <class 'tuple'> <class 'int'>", "ill": false, "static": false, "pkgs": false, "pit": "Writing `(1)` and expecting a tuple. It is just the int 1.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/datastructures.html#tuples-and-sequences", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 24, "t": "Sets", "an": "A bag of unique stickers: no duplicates and no order.", "ex": "`set` stores unique hashable items with average O(1) membership tests. Operators `| & - ^` give union, intersection, difference and symmetric difference. `frozenset` is the immutable version.", "code": "a, b = {\"web\", \"db\", \"cache\"}, {\"db\", \"queue\"}\nprint(sorted(a | b), sorted(a & b), sorted(a - b), sorted(a ^ b))\nprint(\"db\" in a, {1, 2} <= {1, 2, 3})\nprint(len(set([3, 1, 3, 2, 1])))\nprint(list(dict.fromkeys([3, 1, 3, 2, 1])))     # dedupe, keep order", "lang": "python", "out": "['cache', 'db', 'queue', 'web'] ['db'] ['cache', 'web'] ['cache', 'queue', 'web']\nTrue True\n3\n[3, 1, 2]", "ill": false, "static": false, "pkgs": false, "pit": "Expecting order from a set, or writing `{}` for an empty set. That is a dict; use `set()`.", "pro": null, "ops": "Compare desired and actual resources: `desired - actual` = to create, `actual - desired` = to delete. That is exactly what a reconciler (GitOps) does.", "q": "How do you create an empty set?", "a": "`set()`. The literal `{}` creates an empty dict.", "doc": "https://docs.python.org/3/tutorial/datastructures.html#sets", "w": "setlab", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 25, "t": "Dictionaries", "an": "A phone book: look things up by name, not by position.", "ex": "A hash map of unique hashable keys to values. Insertion-ordered (3.7+) with average O(1) lookup. Use `get`, `setdefault`, `items`, `update`, the `|` merge operator, and `defaultdict` / `Counter` for grouping and counting.", "code": "pod = {\"apiVersion\": \"v1\", \"kind\": \"Pod\",\n       \"metadata\": {\"name\": \"web\", \"labels\": {\"app\": \"shop\"}},\n       \"spec\": {\"containers\": [{\"name\": \"c\", \"image\": \"nginx:1.27\"}]}}\nprint(pod[\"metadata\"][\"labels\"][\"app\"])\nprint(pod.get(\"status\", \"no status yet\"))\npod[\"metadata\"][\"labels\"] |= {\"tier\": \"frontend\"}\nfor k, v in pod[\"metadata\"][\"labels\"].items():\n    print(k, \"=\", v)\n\ndisks = [{\"name\": \"d1\", \"users\": [\"vm-a\"]}, {\"name\": \"d2\"}, {\"name\": \"d3\", \"users\": []}]\nprint([d[\"name\"] for d in disks if not d.get(\"users\")])      # unattached disks", "lang": "python", "out": "shop\nno status yet\napp = shop\ntier = frontend\n['d2', 'd3']", "ill": false, "static": false, "pkgs": false, "pit": "`d[key]` raising KeyError on a missing key. Use `.get()` or test with `in`.", "pro": "Model structured data with dataclasses or Pydantic once the shape is known; keep raw dicts at the edges.", "ops": "A Kubernetes manifest *is* a dict. Cleaning up unattached GCP disks is a list-of-dicts filter like the last two lines.", "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/datastructures.html#dictionaries", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 26, "t": "Comprehensions", "an": "A factory conveyor belt: items go in, get filtered and transformed, and come out as a new collection.", "ex": "`[expr for x in iterable if cond]` builds a list. Use `{}` for sets and `{k: v ...}` for dicts. Parentheses make a **generator expression** that computes lazily.", "code": "nums = range(1, 8)\nprint([n * n for n in nums if n % 2])\nprint({n: n % 3 for n in nums})\nprint({len(w) for w in [\"aa\", \"bb\", \"ccc\"]})\nprint(sum(n for n in nums))              # generator expression: no list built\npairs = [(a, b) for a in \"ab\" for b in (1, 2)]\nprint(pairs)", "lang": "python", "out": "[1, 9, 25, 49]\n{1: 1, 2: 2, 3: 0, 4: 1, 5: 2, 6: 0, 7: 1}\n{2, 3}\n28\n[('a', 1), ('a', 2), ('b', 1), ('b', 2)]", "ill": false, "static": false, "pkgs": false, "pit": "Nested comprehensions that nobody can read. Use a loop when it needs more than about two clauses.", "pro": "Use a generator expression when you only iterate once, for example inside `sum()`, `any()`, `max()`.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/datastructures.html#list-comprehensions", "w": "comp", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 27, "t": "Iteration Protocol", "an": "A ticket dispenser: you keep pulling the next ticket until it is empty.", "ex": "`iter(obj)` returns an **iterator**; `next(it)` returns the next item or raises `StopIteration`. A `for` loop does exactly this. An **iterable** has `__iter__`; an **iterator** has `__next__` and returns itself from `__iter__`.", "code": "it = iter([10, 20])\nprint(next(it), next(it))\ntry:\n    next(it)\nexcept StopIteration:\n    print(\"exhausted\")\nprint(list(it))          # an iterator is single-use", "lang": "python", "out": "10 20\nexhausted\n[]", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": "What does a `for` loop do when it gets `StopIteration`?", "a": "It ends the loop quietly.", "doc": "https://docs.python.org/3/library/stdtypes.html#iterator-types", "w": null, "mm": "flowchart LR\nA[\"for x in obj\"] --> B[\"it = iter(obj)\"]\nB --> C[\"next(it)\"]\nC -->|value| D[\"loop body\"]\nD --> C\nC -->|StopIteration| E[\"loop ends\"]", "skiprec": false, "pytest": false, "stdin": null}, {"n": 28, "t": "Generators", "an": "A vending machine that makes one snack per press instead of baking the whole batch first.", "ex": "A function with `yield` returns a **generator**: it pauses at each `yield` and resumes on the next `next()`. It is lazy, uses constant memory, and can model infinite streams. Generator expressions are the one-line form.", "code": "def read_chunks(lines, size):\n    batch = []\n    for line in lines:\n        batch.append(line)\n        if len(batch) == size:\n            yield batch\n            batch = []\n    if batch:\n        yield batch\n\nprint(list(read_chunks([\"a\", \"b\", \"c\", \"d\", \"e\"], 2)))\nsquares = (n * n for n in range(10**9))     # lazy: nothing computed yet\nprint(next(squares), next(squares), next(squares))", "lang": "python", "out": "[['a', 'b'], ['c', 'd'], ['e']]\n0 1 4", "ill": false, "static": false, "pkgs": false, "pit": "Treating a generator like a list: you cannot `len()` it, index it, or loop over it twice.", "pro": null, "ops": "Generators are log streaming: `for line in follow(file)` processes unlimited logs with constant memory.", "q": null, "a": null, "doc": "https://docs.python.org/3/howto/functional.html#generators", "w": "gen", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 29, "t": "Iterators", "an": "A custom dispenser you build yourself.", "ex": "Write a class with `__iter__` and `__next__` when you need an iterator with extra state or methods. `itertools` offers ready-made building blocks (`count`, `islice`, `chain`, `groupby`, `product`).", "code": "import itertools\n\nclass Countdown:\n    def __init__(self, start):\n        self.n = start\n    def __iter__(self):\n        return self\n    def __next__(self):\n        if self.n <= 0:\n            raise StopIteration\n        self.n -= 1\n        return self.n + 1\n\nprint(list(Countdown(3)))\nprint(list(itertools.islice(itertools.count(10, 5), 3)))", "lang": "python", "out": "[3, 2, 1]\n[10, 15, 20]", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": "Prefer a generator function over a hand-written iterator class unless you need extra methods or state.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/itertools.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 30, "t": "Enumerate", "an": "Numbering the items on a list while you read them.", "ex": "`enumerate(iterable, start=0)` yields `(index, item)` pairs, replacing the `range(len(xs))` pattern.", "code": "for i, ch in enumerate(\"abc\"):\n    print(i, ch)\nprint(list(enumerate([\"x\", \"y\"], start=1)))", "lang": "python", "out": "0 a\n1 b\n2 c\n[(1, 'x'), (2, 'y')]", "ill": false, "static": false, "pkgs": false, "pit": "`for i in range(len(xs)): xs[i]`. It is noisy and error-prone.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/functions.html#enumerate", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 31, "t": "Zip", "an": "A zipper that interlocks two rows of teeth.", "ex": "`zip(a, b)` pairs items from several iterables and stops at the shortest (pass `strict=True` to raise on unequal lengths). `zip(*pairs)` unzips; `itertools.zip_longest` pads.", "code": "import itertools\nnames, ports = [\"web\", \"db\"], [80, 5432]\nprint(dict(zip(names, ports)))\nprint(list(zip(\"abc\", [1, 2])))                        # stops at the shortest\nprint(list(itertools.zip_longest(\"abc\", [1, 2], fillvalue=0)))\nprint(list(zip(*[(1, \"a\"), (2, \"b\")])))                # unzip\nprint(list(zip(\"ab\", [1, 2], strict=True)))", "lang": "python", "out": "{'web': 80, 'db': 5432}\n[('a', 1), ('b', 2)]\n[('a', 1), ('b', 2), ('c', 0)]\n[(1, 2), ('a', 'b')]\n[('a', 1), ('b', 2)]", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/functions.html#zip", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 32, "t": "Lambda Functions", "an": "A sticky note with a tiny instruction instead of a full recipe card.", "ex": "`lambda args: expression` is an anonymous single-expression function, handy as a `key=` argument. If it needs a name or more than one expression, use `def`.", "code": "pods = [{\"n\": \"b\", \"cpu\": 3}, {\"n\": \"a\", \"cpu\": 9}]\nprint(sorted(pods, key=lambda p: p[\"cpu\"], reverse=True)[0][\"n\"])\nadd = lambda a, b: a + b       # legal, but PEP 8 prefers def for named functions\nprint(add(2, 3))", "lang": "python", "out": "a\n5", "ill": false, "static": false, "pkgs": false, "pit": "Assigning a lambda to a name. Use `def` so tracebacks show a real name.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/controlflow.html#lambda-expressions", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 33, "t": "Higher-Order Functions", "an": "A manager who accepts another worker as an argument.", "ex": "Functions are first-class objects, so they can be passed as arguments, returned, and stored. A higher-order function takes or returns a function. `functools.partial` pre-fills arguments.", "code": "from functools import partial\n\ndef apply_twice(fn, x):\n    return fn(fn(x))\n\ndef make_multiplier(k):\n    return lambda n: n * k\n\nprint(apply_twice(lambda n: n * 2, 5))\ntriple = make_multiplier(3)\nprint(triple(7), partial(pow, 2)(10))", "lang": "python", "out": "20\n21 1024", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": "Retry wrappers, callbacks and plug-in hooks in automation tools are higher-order functions.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/functools.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 34, "t": "Map, Filter, and Reduce", "an": "Transform every item, keep only some, or fold the lot into one value.", "ex": "`map(f, xs)` transforms, `filter(p, xs)` keeps, `functools.reduce(f, xs)` folds. All return lazy iterators (except `reduce`). Comprehensions are usually clearer than `map`/`filter` with a lambda.", "code": "from functools import reduce\nnums = [1, 2, 3, 4]\nprint(list(map(lambda n: n * n, nums)), list(filter(lambda n: n % 2, nums)))\nprint(reduce(lambda a, b: a * b, nums), sum(nums), max(nums, key=lambda n: -n))\nprint([n * n for n in nums])       # usually clearer", "lang": "python", "out": "[1, 4, 9, 16] [1, 3]\n24 10 1\n[1, 4, 9, 16]", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": "Reach for `sum`, `min`, `max`, `any`, `all` before `reduce`.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/functions.html#map", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 35, "t": "Sorting", "an": "Arranging books on a shelf by a rule you choose.", "ex": "`sorted(xs, key=..., reverse=...)` returns a new list; `xs.sort()` sorts in place and returns `None`. Sorting is **stable**: equal items keep their original order. Use tuple keys to sort by several fields.", "code": "words = [\"pear\", \"Fig\", \"apple\", \"fig\"]\nprint(sorted(words), sorted(words, key=str.lower))\nrecs = [(\"b\", 2), (\"a\", 2), (\"c\", 1)]\nprint(sorted(recs, key=lambda r: r[1]))                  # stable: b stays before a\nprint(sorted(recs, key=lambda r: (-r[1], r[0])))\nxs = [3, 1, 2]\nxs.sort()\nprint(xs)", "lang": "python", "out": "['Fig', 'apple', 'fig', 'pear'] ['apple', 'Fig', 'fig', 'pear']\n[('c', 1), ('b', 2), ('a', 2)]\n[('a', 2), ('b', 2), ('c', 1)]\n[1, 2, 3]", "ill": false, "static": false, "pkgs": false, "pit": "Writing `xs = xs.sort()`. It returns `None`.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/howto/sorting.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 36, "t": "Searching", "an": "Finding a word: scan every page, or open the dictionary near the middle and halve the range.", "ex": "`x in xs` and `xs.index(x)` scan linearly (O(n)). On **sorted** data use binary search (`bisect`) for O(log n). For repeated lookups, put the data in a `set` or `dict`.", "code": "import bisect\nxs = [1, 3, 5, 7, 9]\nprint(5 in xs, xs.index(7))\nprint(bisect.bisect_left(xs, 6), bisect.bisect_left(xs, 7))\n\ndef binary_search(a, target):\n    lo, hi = 0, len(a) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if a[mid] == target:\n            return mid\n        lo, hi = (mid + 1, hi) if a[mid] < target else (lo, mid - 1)\n    return -1\n\nprint(binary_search(xs, 9), binary_search(xs, 4))\nprint(next((x for x in xs if x > 4), None))", "lang": "python", "out": "True 3\n3 3\n4 -1\n5", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/bisect.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 37, "t": "Recursion", "an": "Russian nesting dolls: to open the big one, open the smaller one inside it.", "ex": "A recursive function calls itself on a smaller problem and needs a **base case**. Each call gets its own stack frame. Python does not optimise tail calls and limits depth (about 1000 by default).", "code": "import sys\n\ndef fact(n):\n    return 1 if n <= 1 else n * fact(n - 1)\n\nprint(fact(5))\nprint(sys.getrecursionlimit() >= 1000)\n\ndef flatten(x):\n    return [y for i in x for y in flatten(i)] if isinstance(x, list) else [x]\n\nprint(flatten([1, [2, [3, [4]]], 5]))", "lang": "python", "out": "120\nTrue\n[1, 2, 3, 4, 5]", "ill": false, "static": false, "pkgs": false, "pit": "No base case gives `RecursionError`. Deep recursion should become a loop.", "pro": null, "ops": "Walking nested YAML/JSON, such as Kubernetes manifests or Terraform state, is the everyday use.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/sys.html#sys.getrecursionlimit", "w": "stack", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 38, "t": "Pattern Matching", "an": "A sorting office that routes each parcel by its shape and label.", "ex": "`match` / `case` (Python 3.10+) is **structural** pattern matching: it destructures sequences, mappings and class instances, with guards (`if`) and or-patterns (`|`). It is more than a switch statement.", "code": "def handle(event):\n    match event:\n        case {\"type\": \"deploy\", \"env\": \"prod\" | \"staging\" as env}:\n            return f\"deploy to {env}\"\n        case {\"type\": \"scale\", \"replicas\": int(n)} if n > 0:\n            return f\"scale to {n}\"\n        case [first, *_]:\n            return f\"list starting {first}\"\n        case _:\n            return \"unknown\"\n\nfor e in ({\"type\": \"deploy\", \"env\": \"prod\"}, {\"type\": \"scale\", \"replicas\": 3}, [9, 8], 42):\n    print(handle(e))", "lang": "python", "out": "deploy to prod\nscale to 3\nlist starting 9\nunknown", "ill": false, "static": false, "pkgs": false, "pit": "Writing `case x:` expecting a comparison. A bare name is a **capture** that matches anything.", "pro": null, "ops": "Routing webhook or event payloads by shape is the natural use.", "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/controlflow.html#match-statements", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}]}, {"id": 3, "short": "Intermediate", "title": "Intermediate Python", "icon": "🧠", "goal": "Understand how Python really works: namespaces, scope, the memory model, mutability, identity, references, garbage collection, then the tools of professional code: exceptions, context managers, decorators, closures, typing, dataclasses, enums, protocols and abstract base classes.", "devops": "Most production bugs come from this phase: shared mutable state, swallowed exceptions, leaked connections. **Context managers** guard connections and temp resources, **decorators** add metrics and retries, **dataclasses and enums** model configuration safely.", "docs": [["Data model", "https://docs.python.org/3/reference/datamodel.html"], ["Errors tutorial", "https://docs.python.org/3/tutorial/errors.html"], ["typing module", "https://docs.python.org/3/library/typing.html"]], "mm": "flowchart TB\nBaseException --> SystemExit\nBaseException --> KeyboardInterrupt\nBaseException --> Exception\nException --> ArithmeticError\nArithmeticError --> ZeroDivisionError\nException --> LookupError\nLookupError --> KeyError\nLookupError --> IndexError\nException --> ValueError\nException --> TypeError\nException --> OSError\nOSError --> FileNotFoundError", "topics": [{"n": 39, "t": "Namespaces", "an": "Separate rooms in a building, each with its own set of name labels.", "ex": "A **namespace** maps names to objects. There are built-in, global (module), enclosing and local namespaces; every class and instance has one too. Inspect them with `globals()`, `locals()`, `dir()` and `vars()`.", "code": "import builtins, math\nx = \"module\"\n\ndef f():\n    y = \"local\"\n    print(sorted(locals()))\n\nf()\nprint(\"x\" in globals(), \"len\" in dir(builtins))\nprint(math.__name__, \"sqrt\" in vars(math))", "lang": "python", "out": "['y']\nTrue True\nmath True", "ill": false, "static": false, "pkgs": false, "pit": "Shadowing built-ins with names like `list`, `id`, `type` or `input`.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/classes.html#python-scopes-and-namespaces", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 40, "t": "Scope", "an": "Ask in your room first, then the house, then the street, then the whole world.", "ex": "Name lookup follows **LEGB**: Local → Enclosing → Global → Built-in. Assigning to a name inside a function makes it local unless you declare `global` or `nonlocal`.", "code": "count = 0\n\ndef bump():\n    global count\n    count += 1\n\ndef counter():\n    n = 0\n    def inc():\n        nonlocal n\n        n += 1\n        return n\n    return inc\n\nbump()\nc = counter()\nc()\nprint(count, c())\n\ntotal = 0\ndef bad():\n    try:\n        total += 1           # assignment makes `total` local, so reading it fails\n    except UnboundLocalError:\n        print(\"UnboundLocalError\")\nbad()", "lang": "python", "out": "1 2\nUnboundLocalError", "ill": false, "static": false, "pkgs": false, "pit": "Using `global` everywhere. Pass values in and return values out instead.", "pro": "Avoid mutable global state; pass dependencies explicitly.", "ops": null, "q": "Which keyword lets an inner function rebind a variable of the enclosing function?", "a": "`nonlocal`.", "doc": "https://docs.python.org/3/reference/executionmodel.html#resolution-of-names", "w": "scope", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 41, "t": "Memory Model", "an": "A warehouse where every box has a label, a type sticker and an id, and names are just tags pointing at boxes.", "ex": "Everything is an object with an **identity** (`id`), a **type** and a **value**. Variables are references. CPython allocates objects on a private heap and frees them with **reference counting** plus a cyclic garbage collector.", "code": "import sys\na = [1, 2, 3]\nprint(type(a), id(a) == id(a), isinstance(id(a), int))\nprint(sys.getsizeof([]) < sys.getsizeof([1, 2, 3, 4, 5, 6, 7, 8, 9]))\nb = a\nprint(a is b, sys.getrefcount(a) >= 3)", "lang": "python", "out": "<class 'list'> True True\nTrue\nTrue True", "ill": false, "static": false, "pkgs": false, "pit": "Relying on small-integer caching or string interning. They are implementation details.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/reference/datamodel.html#objects-values-and-types", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 42, "t": "Mutability", "an": "Pencil (mutable) versus ink (immutable).", "ex": "**Mutable** objects change in place: `list`, `dict`, `set`, most classes. **Immutable** objects cannot: `int`, `float`, `str`, `tuple`, `frozenset`, `bytes`. Only hashable (effectively immutable) objects can be dict keys or set members. A tuple is immutable but may *contain* mutable objects.", "code": "s = \"abc\"\ntry:\n    s[0] = \"X\"\nexcept TypeError as e:\n    print(\"str is immutable:\", e)\nlst = [1, 2]\nlst[0] = 99\nprint(lst)\nt = ([1], 2)\nt[0].append(9)\nprint(t)                                # the tuple is fixed, its inner list is not\ntry:\n    hash(([1], 2))\nexcept TypeError as e:\n    print(\"unhashable:\", e)", "lang": "python", "out": "str is immutable: 'str' object does not support item assignment\n[99, 2]\n([1, 9], 2)\nunhashable: unhashable type: 'list'", "ill": false, "static": false, "pkgs": false, "pit": "Mutable default arguments (topic 44) and using a list as a dict key.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/reference/datamodel.html#objects-values-and-types", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 43, "t": "Identity vs Equality", "an": "Two identical twins (equal) versus one person with two nicknames (identical).", "ex": "`==` asks \"do these have the same value?\" (calls `__eq__`). `is` asks \"are these the very same object?\" Use `is` for `None`, `True`, `False` and sentinels; use `==` for values.", "code": "a, b = [1, 2], [1, 2]\nprint(a == b, a is b, a is a)\nx = None\nprint(x is None, x == None)\n\nclass Always:\n    def __eq__(self, other):\n        return True\n\nprint(Always() == None, Always() is None)", "lang": "python", "out": "True False True\nTrue True\nTrue False", "ill": false, "static": false, "pkgs": false, "pit": "`if x == None:` can be fooled by a custom `__eq__`. And `256 is 256` being True is a CPython caching detail, not a guarantee.", "pro": "`is None` / `is not None`, always.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/reference/expressions.html#is-not", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 44, "t": "References", "an": "Handing someone the address of a house versus building them a copy of the house.", "ex": "Python passes **object references by value** (\"pass by assignment\"). A function can mutate a mutable argument, but rebinding the parameter name does not affect the caller. `copy.copy` is shallow; `copy.deepcopy` copies recursively. Step through the visualiser, then run the code.", "code": "import copy\n\ndef add_item(items, x):\n    items.append(x)          # mutates the caller's list\n\ndef rebind(items):\n    items = [0]              # rebinds the local name only\n\ndata = [1]\nadd_item(data, 2)\nrebind(data)\nprint(data)\n\nnested = [[1], [2]]\nshallow, deep = copy.copy(nested), copy.deepcopy(nested)\nnested[0].append(\"X\")\nprint(shallow[0], deep[0])\n\ndef bad_default(x, acc=[]):         # the default list is created ONCE\n    acc.append(x)\n    return acc\nprint(bad_default(1), bad_default(2))", "lang": "python", "out": "[1, 2]\n[1, 'X'] [1]\n[1, 2] [1, 2]", "ill": false, "static": false, "pkgs": false, "pit": "Mutable default arguments: `def f(x, acc=[])` shares one list across all calls.", "pro": "Use `acc=None` and create the list inside the function.", "ops": "Copying a config dict before editing it per environment (`copy.deepcopy`) prevents one environment's change from leaking into another.", "q": "After `b = a[:]` does `b.append(1)` change `a`?", "a": "No. A slice makes a new (shallow) copy.", "doc": "https://docs.python.org/3/library/copy.html", "w": "alias", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 45, "t": "Garbage Collection", "an": "A janitor who removes any item nobody is holding a label for.", "ex": "CPython frees an object the moment its **reference count** hits zero. Reference **cycles** (A points to B and B points to A) are found by the cyclic collector in the `gc` module. `weakref` lets you refer to an object without keeping it alive.", "code": "import gc, weakref\ngc.disable()                      # make the demo deterministic\n\nclass Node:\n    pass\n\na = Node()\nr = weakref.ref(a)\nprint(r() is a)\ndel a\nprint(r())                        # refcount reached 0: freed immediately\n\nx, y = Node(), Node()\nx.other, y.other = y, x           # a reference cycle\nrx = weakref.ref(x)\ndel x, y\nprint(rx() is not None)           # the cycle keeps them alive...\ngc.collect()\nprint(rx())                       # ...until the cyclic GC runs\ngc.enable()", "lang": "python", "out": "True\nNone\nTrue\nNone", "ill": false, "static": false, "pkgs": false, "pit": "Relying on `__del__` to release important resources. Use context managers.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/gc.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 46, "t": "Exception Handling", "an": "A safety net under a trapeze: you plan for the fall and clean up afterwards.", "ex": "`try` runs code that may fail; `except` handles specific errors; `else` runs only if nothing was raised; `finally` always runs. Raise with `raise`, chain with `raise ... from e`. Catch the **narrowest** exception you can actually handle. Explore the flow below.", "code": "def run(s):\n    try:\n        n = int(s)\n    except ValueError:\n        print(\"  except: bad input\", repr(s))\n    else:\n        print(\"  else: parsed\", n)\n    finally:\n        print(\"  finally: always runs\")\n\nfor s in (\"42\", \"x\"):\n    print(\"input\", s)\n    run(s)\n\ntry:\n    {}[\"k\"]\nexcept (KeyError, IndexError) as e:\n    print(\"caught\", type(e).__name__, e)", "lang": "python", "out": "input 42\n  else: parsed 42\n  finally: always runs\ninput x\n  except: bad input 'x'\n  finally: always runs\ncaught KeyError 'k'", "ill": false, "static": false, "pkgs": false, "pit": "Bare `except:` or `except Exception: pass`, which swallows real bugs.", "pro": "Catch narrowly, close to where you can handle it; log with the traceback (`logger.exception`).", "ops": "A deploy script retries only transient errors (timeouts, HTTP 429/503) and fails fast on config errors (4xx).", "q": "Does the `else` block run when the `try` block raised an exception?", "a": "No. It only runs when the `try` block finished without an exception.", "doc": "https://docs.python.org/3/tutorial/errors.html", "w": "exc", "mm": "flowchart TD\nA[\"try block\"] -->|no error| B[\"else block\"]\nA -->|error raised| C{\"matching except?\"}\nC -->|yes| D[\"except block\"]\nC -->|no| E[\"propagate to caller\"]\nB --> F[\"finally block\"]\nD --> F\nE --> F", "skiprec": false, "pytest": false, "stdin": null}, {"n": 47, "t": "Context Managers", "an": "A hotel door that always locks behind you, even if you leave in a hurry.", "ex": "`with` guarantees setup and cleanup via `__enter__` / `__exit__` (or `@contextlib.contextmanager`). The exit code runs even when an exception occurs.", "code": "from contextlib import contextmanager\n\nclass Resource:\n    def __enter__(self):\n        print(\"open\")\n        return self\n    def __exit__(self, exc_type, exc, tb):\n        print(\"close\", exc_type.__name__ if exc_type else \"clean\")\n        return False              # do not swallow the exception\n\nwith Resource():\n    print(\"working\")\ntry:\n    with Resource():\n        raise RuntimeError(\"boom\")\nexcept RuntimeError:\n    print(\"handled outside\")\n\n@contextmanager\ndef labelled(name):\n    print(\"enter\", name)\n    try:\n        yield name\n    finally:\n        print(\"exit\", name)\n\nwith labelled(\"db\") as n:\n    print(\"using\", n)", "lang": "python", "out": "open\nworking\nclose clean\nopen\nclose RuntimeError\nhandled outside\nenter db\nusing db\nexit db", "ill": false, "static": false, "pkgs": false, "pit": "Calling `open()` or `connect()` without `with`, which leaks the handle on errors.", "pro": null, "ops": "Database connections, file handles, locks, temporary directories and `kubectl port-forward` sessions: `with` guarantees cleanup even when the script fails.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/contextlib.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 48, "t": "Decorators", "an": "Gift wrapping: the present inside is unchanged, but it gains a wrapper that runs before and after.", "ex": "A decorator is a function that takes a function and returns a (usually wrapped) function. `@d` above `def f` means `f = d(f)`. Use `functools.wraps` to keep the name and docstring. Stacked decorators apply bottom-up.", "code": "import functools\n\ndef logged(fn):\n    @functools.wraps(fn)\n    def wrapper(*args, **kwargs):\n        print(f\"calling {fn.__name__}{args}\")\n        result = fn(*args, **kwargs)\n        print(f\"{fn.__name__} returned {result}\")\n        return result\n    return wrapper\n\n@logged\ndef add(a, b):\n    \"\"\"Add two numbers.\"\"\"\n    return a + b\n\nadd(2, 3)\nprint(add.__name__, add.__doc__)", "lang": "python", "out": "calling add(2, 3)\nadd returned 5\nadd Add two numbers.", "ill": false, "static": false, "pkgs": false, "pit": "Forgetting `functools.wraps`, so the function loses its name and docstring.", "pro": null, "ops": "Observability instrumentation: decorators add timing, metrics, retries and tracing around functions without touching their logic.", "q": null, "a": null, "doc": "https://docs.python.org/3/glossary.html#term-decorator", "w": "deco", "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 49, "t": "Closures", "an": "A backpack a function carries with the variables from where it was born.", "ex": "A **closure** is an inner function that remembers variables from its enclosing function even after that function has returned. Closures capture *variables*, not values, which causes the late-binding gotcha below.", "code": "def make_counter(start=0):\n    count = start\n    def tick():\n        nonlocal count\n        count += 1\n        return count\n    return tick\n\na, b = make_counter(), make_counter(10)\nprint(a(), a(), b())\n\nfns = [lambda: i for i in range(3)]\nprint([f() for f in fns])                    # late binding: all see the final i\nfixed = [lambda i=i: i for i in range(3)]\nprint([f() for f in fixed])", "lang": "python", "out": "1 2 11\n[2, 2, 2]\n[0, 1, 2]", "ill": false, "static": false, "pkgs": false, "pit": "Building callbacks in a loop that all capture the same variable.", "pro": "Bind the current value with a default argument (`lambda i=i: i`) or `functools.partial`.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/reference/compound_stmts.html#function-definitions", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 50, "t": "Callable Objects", "an": "An object that can be 'dialled' like a phone.", "ex": "Anything with `__call__` is callable: functions, classes, methods, and instances of classes that define `__call__`. Callable objects carry state, unlike plain functions.", "code": "class Multiplier:\n    def __init__(self, k):\n        self.k = k\n    def __call__(self, x):\n        return x * self.k\n\ndouble = Multiplier(2)\nprint(double(21), callable(double), callable(len), callable(42))\nprint(list(map(double, [1, 2, 3])))", "lang": "python", "out": "42 True True False\n[2, 4, 6]", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/reference/datamodel.html#object.__call__", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 51, "t": "Typing System", "an": "Labels on jars: the labels do not change the contents, but they stop you pouring salt into the sugar.", "ex": "**Type hints** document intended types (`list[int]`, `int | None`, `Callable`). Python does **not** enforce them at runtime. Static checkers such as `mypy` and `pyright` (and editors) use them to find bugs before you run the code.", "code": "def first(xs: list[int], default: int | None = None) -> int | None:\n    return xs[0] if xs else default\n\nprint(first([5]), first([]))\nprint(first.__annotations__)\nx: int = \"not enforced at runtime\"\nprint(x)", "lang": "python", "out": "5 None\n{'xs': list[int], 'default': int | None, 'return': int | None}\nnot enforced at runtime", "ill": false, "static": false, "pkgs": false, "pit": "Assuming hints validate data. For runtime validation use Pydantic or explicit checks.", "pro": "Type-check in CI (`mypy src`) and annotate public functions first.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/typing.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 52, "t": "Dataclasses", "an": "A form with labelled fields where the paperwork (init, repr, equality) is filled in automatically.", "ex": "`@dataclass` generates `__init__`, `__repr__`, `__eq__` (and ordering with `order=True`) from annotated fields. Use `field(default_factory=list)` for mutable defaults and `frozen=True` for immutability.", "code": "from dataclasses import dataclass, field, asdict\n\n@dataclass(frozen=True, order=True)\nclass Version:\n    major: int\n    minor: int = 0\n    tags: tuple = ()\n\nv = Version(1, 2)\nprint(v, v == Version(1, 2), v < Version(1, 3))\nprint(asdict(v))\n\n@dataclass\nclass Pod:\n    name: str\n    labels: dict = field(default_factory=dict)\n\np = Pod(\"web\")\np.labels[\"app\"] = \"shop\"\nprint(p)", "lang": "python", "out": "Version(major=1, minor=2, tags=()) True True\n{'major': 1, 'minor': 2, 'tags': ()}\nPod(name='web', labels={'app': 'shop'})", "ill": false, "static": false, "pkgs": false, "pit": "`labels: dict = {}` raises ValueError (mutable default). Use `default_factory`.", "pro": null, "ops": "Typed config objects for deployments and cluster settings.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/dataclasses.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 53, "t": "Enums", "an": "A multiple-choice question: only the listed options are allowed.", "ex": "`Enum` defines a fixed set of named constants. Use it instead of magic strings. `IntEnum` compares like ints; `StrEnum` (3.11+) behaves like a string.", "code": "from enum import Enum, IntEnum, auto\n\nclass Env(Enum):\n    DEV = \"dev\"\n    PROD = \"prod\"\n\nclass Level(IntEnum):\n    LOW = auto()\n    HIGH = auto()\n\nprint(Env(\"prod\"), Env.DEV.value, Env[\"PROD\"].name, list(Env))\nprint(Level.HIGH > Level.LOW, Level.HIGH == 2)\ntry:\n    Env(\"qa\")\nexcept ValueError as e:\n    print(e)", "lang": "python", "out": "Env.PROD dev PROD [<Env.DEV: 'dev'>, <Env.PROD: 'prod'>]\nTrue True\n'qa' is not a valid Env", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": "`Env` values stop typos like `\"porduction\"` from reaching a deploy script.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/enum.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 54, "t": "Protocols", "an": "'If it quacks like a duck': the job posting lists skills, not a specific person.", "ex": "A `Protocol` describes the methods an object must have (**structural typing**), with no inheritance required. Type checkers verify it statically; `@runtime_checkable` enables `isinstance` checks of method presence.", "code": "from typing import Protocol, runtime_checkable\n\n@runtime_checkable\nclass Closeable(Protocol):\n    def close(self) -> None: ...\n\nclass Conn:\n    def close(self) -> None:\n        print(\"closed\")\n\ndef shutdown(x: Closeable) -> None:\n    x.close()\n\nshutdown(Conn())\nprint(isinstance(Conn(), Closeable), isinstance(42, Closeable))", "lang": "python", "out": "closed\nTrue False", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": "Prefer Protocols to inheritance for small interfaces (the Interface Segregation Principle).", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/typing.html#typing.Protocol", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 55, "t": "Abstract Base Classes", "an": "A contract that says 'every subclass must implement these jobs'.", "ex": "`abc.ABC` with `@abstractmethod` forbids instantiating a class until all abstract methods are implemented. Use it when you want shared behaviour plus an enforced interface.", "code": "from abc import ABC, abstractmethod\n\nclass Backend(ABC):\n    @abstractmethod\n    def deploy(self, app: str) -> str: ...\n    def describe(self):\n        return f\"{type(self).__name__} ready\"\n\nclass K8s(Backend):\n    def deploy(self, app):\n        return f\"kubectl apply {app}\"\n\ntry:\n    Backend()\nexcept TypeError as e:\n    print(e)\nk = K8s()\nprint(k.deploy(\"web\"), \"|\", k.describe())", "lang": "python", "out": "Can't instantiate abstract class Backend without an implementation for abstract method 'deploy'\nkubectl apply web | K8s ready", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": "A `Backend` ABC with `K8s`, `Nomad`, `Local` implementations is a typical infrastructure abstraction.", "q": null, "a": null, "doc": "https://docs.python.org/3/library/abc.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}]}, {"id": 4, "short": "OOP", "title": "Object-Oriented Programming", "icon": "🏗️", "goal": "Model the world with objects: classes, attributes, methods, constructors, inheritance, polymorphism, composition, encapsulation and abstraction, then go deeper with magic methods, properties, descriptors, metaclasses and the SOLID principles.", "devops": "OOP is how infrastructure code stays maintainable: a `Cluster` class hides cloud API details, a `Deployer` interface lets you swap Helm for kubectl, and `__enter__`/`__exit__` manage connections. Python's own libraries (Kubernetes client, Boto3, Pulumi) are object models.", "docs": [["Classes tutorial", "https://docs.python.org/3/tutorial/classes.html"], ["Data model (special methods)", "https://docs.python.org/3/reference/datamodel.html"], ["Descriptor HOWTO", "https://docs.python.org/3/howto/descriptor.html"]], "mm": "classDiagram\nclass Backend {\n  +deploy(app)\n}\nclass K8s\nclass Nomad\nBackend <|-- K8s\nBackend <|-- Nomad\nclass Deployer {\n  +backend: Backend\n  +run(app)\n}\nDeployer o-- Backend", "topics": [{"n": 56, "t": "Objects", "an": "Everything in Python is a thing with data and behaviour, like objects in a room.", "ex": "Every value is an **object**: numbers, strings, functions, classes and modules. An object bundles **state** (data) with **behaviour** (methods). Classes are objects too, instances of `type`.", "code": "for o in (5, \"s\", len, int, print):\n    print(type(o).__name__, hasattr(o, \"__class__\"))\nprint(isinstance(int, type), type(type))\n\ndef f():\n    pass\nf.note = \"functions can carry attributes\"\nprint(f.note)", "lang": "python", "out": "int True\nstr True\nbuiltin_function_or_method True\ntype True\nbuiltin_function_or_method True\nTrue <class 'type'>\nfunctions can carry attributes", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/reference/datamodel.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 57, "t": "Classes", "an": "A blueprint for building houses; each house built from it is an object.", "ex": "`class` defines a new type. `__init__` initialises each **instance**. `self` is the instance. **Class attributes** are shared by all instances; **instance attributes** belong to one.", "code": "class Server:\n    \"\"\"A host in the fleet.\"\"\"\n    count = 0                       # class attribute (shared)\n\n    def __init__(self, name, cpu=2):\n        self.name = name            # instance attributes\n        self.cpu = cpu\n        Server.count += 1\n\n    def __repr__(self):\n        return f\"Server({self.name!r}, cpu={self.cpu})\"\n\na, b = Server(\"web1\"), Server(\"db1\", 8)\nprint(a, b, Server.count, a.count)", "lang": "python", "out": "Server('web1', cpu=2) Server('db1', cpu=8) 2 2", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": "Add a `__repr__` to every class so debugging output is readable.", "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/classes.html", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 58, "t": "Attributes", "an": "Labels on a house: some belong to the blueprint, some to one house.", "ex": "Attribute lookup checks the **instance** `__dict__`, then the **class**, then base classes. Assigning through an instance creates an instance attribute that *shadows* the class one. Mutating a shared class-level list affects every instance.", "code": "class A:\n    shared = []\n    def __init__(self):\n        self.own = []\n\nx, y = A(), A()\nx.own.append(1)\nx.shared.append(\"s\")\nprint(y.own, y.shared)\nx.shared = \"shadow\"             # creates an instance attribute; the class one is untouched\nprint(A.shared, x.__dict__)", "lang": "python", "out": "[] ['s']\n['s'] {'own': [1], 'shared': 'shadow'}", "ill": false, "static": false, "pkgs": false, "pit": "Using a class-level list or dict as if it were per-instance.", "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/tutorial/classes.html#class-and-instance-variables", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 59, "t": "Methods", "an": "What each house can do: open the door, turn on the light.", "ex": "**Instance methods** take `self`. **Class methods** (`@classmethod`) take `cls` and are great alternative constructors. **Static methods** (`@staticmethod`) take neither and are just namespaced functions.", "code": "class Temp:\n    unit = \"C\"\n    def __init__(self, c):\n        self.c = c\n    def to_f(self):                        # instance method\n        return self.c * 9 / 5 + 32\n    @classmethod\n    def from_f(cls, f):                    # alternative constructor\n        return cls((f - 32) * 5 / 9)\n    @staticmethod\n    def is_valid(c):                       # no self or cls\n        return c >= -273.15\n\nprint(Temp(100).to_f(), Temp.from_f(212).c, Temp.is_valid(-300))", "lang": "python", "out": "212.0 100.0 False", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": null, "ops": null, "q": null, "a": null, "doc": "https://docs.python.org/3/library/functions.html#classmethod", "w": null, "mm": null, "skiprec": false, "pytest": false, "stdin": null}, {"n": 60, "t": "Constructors", "an": "The checklist used when a new house is built.", "ex": "`__new__` creates the object, `__init__` initialises it. In practice you write `__init__` and validate inputs there. Use `@classmethod` factories for alternative ways to build an object. `__new__` matters for singletons and immutable subclasses.", "code": "class Port:\n    def __init__(self, n):\n        if not 0 < n < 65536:\n            raise ValueError(f\"invalid port {n}\")\n        self.n = n\n    @classmethod\n    def from_str(cls, s):\n        return cls(int(s))\n\nprint(Port.from_str(\"8080\").n)\ntry:\n    Port(70000)\nexcept ValueError as e:\n    print(e)\n\nclass Single:\n    _inst = None\n    def __new__(cls):\n        if cls._inst is None:\n            cls._inst = super().__new__(cls)\n        return cls._inst\n\nprint(Single() is Single())", "lang": "python", "out": "8080\ninvalid port 70000\nTrue", "ill": false, "static": false, "pkgs": false, "pit": null, "pro": "Fail fast: validate in the constructor so invalid objects never exist.", "ops": null, "q": null, "a": null, "doc": "
